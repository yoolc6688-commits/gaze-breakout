<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MediaPipe 同源加载探针</title>
<style>body{background:#0A1018;color:#E8F2FF;font:16px/1.7 monospace;padding:18px}#r{font-size:20px;font-weight:700}</style>
</head>
<body>
<div id="r">PENDING</div>
<pre id="log">-</pre>
<script>
window.__MP_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
window.__MP_BASE = new URL('./mp/', location.href).href;
</script>
<script src="./mp/face_mesh.js" onerror="document.getElementById('r').textContent='ERR_SCRIPT_LOAD';"></script>
<script>
(function(){
  var LOG = [];
  function say(s){ LOG.push(s); document.getElementById('log').textContent = LOG.join('\n'); }
  var t0 = performance.now();
  say('MP_BASE=' + window.__MP_BASE);
  say('FaceMesh=' + typeof window.FaceMesh);
  if (typeof window.FaceMesh !== 'function'){
    document.getElementById('r').textContent = 'FAIL: FaceMesh 未定义';
    document.body.setAttribute('data-diag', 'FAIL_NO_FACEMESH');
    return;
  }
  try {
    var fm = new window.FaceMesh({ locateFile: function(f){ return window.__MP_BASE + f; } });
    fm.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
    say('构造成功，调用 initialize()…');
    fm.initialize().then(function(){
      var ms = Math.round(performance.now() - t0);
      say('initialize 完成，耗时 ' + ms + 'ms');
      document.getElementById('r').textContent = 'OK_INIT ' + ms + 'ms';
      document.body.setAttribute('data-diag', 'OK_INIT_' + ms + 'ms base=' + window.__MP_BASE);
    }).catch(function(e){
      say('initialize 失败: ' + (e && e.message));
      document.getElementById('r').textContent = 'FAIL_INIT ' + (e && e.message);
      document.body.setAttribute('data-diag', 'FAIL_INIT:' + (e && e.message));
    });
  } catch (e){
    say('构造异常: ' + e.message);
    document.getElementById('r').textContent = 'FAIL_CTOR ' + e.message;
    document.body.setAttribute('data-diag', 'FAIL_CTOR:' + e.message);
  }
})();
</script>
</body>
</html>
