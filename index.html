<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070A14">
<title>光球突围 · 眼动版 v0.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#070A14;color:#E8F4FF;
  font-family:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#cam{position:fixed;right:10px;top:70px;width:86px;height:64px;object-fit:cover;
  border-radius:10px;transform:scaleX(-1);border:1px solid rgba(79,227,255,.35);
  opacity:.72;z-index:30;pointer-events:none;background:#000;transition:opacity .2s}
#cam.hide{opacity:0}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 26px;text-align:center;z-index:20;
  background:radial-gradient(ellipse at 50% 35%,rgba(18,32,58,.94),rgba(5,8,16,.985) 70%);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scr.hide{display:none}
.scr.solid{background:rgba(5,8,16,.985);backdrop-filter:none;-webkit-backdrop-filter:none}
h1{font-size:25px;font-weight:500;letter-spacing:.10em;margin-bottom:8px;
  background:linear-gradient(96deg,#7FE7FF,#C9A6FF 52%,#FFD166);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:#8FA6C4;line-height:1.75;letter-spacing:.02em}
.note{font-size:11.5px;color:#5E7590;line-height:1.7;margin-top:14px;max-width:340px}
.btn{display:inline-flex;align-items:center;justify-content:center;
  min-width:186px;height:46px;padding:0 26px;margin-top:22px;
  border:1px solid rgba(79,227,255,.55);border-radius:23px;
  background:rgba(79,227,255,.09);color:#9EEBFF;font-size:14.5px;letter-spacing:.06em;
  font-family:inherit;cursor:pointer;transition:all .18s}
.btn:active{transform:scale(.97);background:rgba(79,227,255,.20)}
.btn.ghost{border-color:rgba(143,166,196,.30);background:transparent;color:#8FA6C4;
  min-width:130px;height:40px;font-size:13px;margin-top:12px}
.btn.gold{border-color:rgba(255,209,102,.62);background:rgba(255,209,102,.11);color:#FFD166}
.btn:disabled{opacity:.35;pointer-events:none}
#hud{position:fixed;top:0;left:0;right:0;height:64px;z-index:12;display:flex;
  align-items:center;justify-content:space-between;padding:0 16px;gap:10px;pointer-events:none;
  font-variant-numeric:tabular-nums}
#hud.hide{display:none}
.hc{font-size:11px;color:#5E7590;letter-spacing:.05em}
.hv{font-size:16px;color:#CFE9FF;letter-spacing:.04em}
#barWrap{flex:1;height:3px;background:rgba(79,227,255,.13);border-radius:2px;
  position:relative;overflow:hidden;margin:0 4px}
#bar{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:2px;
  background:linear-gradient(90deg,#4FE3FF,#C9A6FF)}
#diag{position:fixed;left:0;right:0;bottom:0;z-index:14;
  background:linear-gradient(180deg,rgba(6,10,20,0),rgba(6,10,20,.94) 24%);
  padding:10px 14px 14px;font-size:11px;color:#7E93AC;
  transition:transform .22s ease;font-variant-numeric:tabular-nums}
#diag.hide{display:none}
#diag.fold{transform:translateY(calc(100% - 34px))}
#dHead{display:flex;align-items:center;justify-content:space-between;
  height:24px;margin-bottom:6px}
#dHead .ttl{font-size:11px;letter-spacing:.10em;color:#9AB2CC}
#dRows{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin-bottom:9px}
.dr{display:flex;flex-direction:column;gap:2px}
.dr .k{font-size:10px;color:#54687E;letter-spacing:.03em}
.dr .v{font-size:13px;color:#BFD9F2}
.dr .v.g{color:#7EE6A8}.dr .v.y{color:#FFD166}.dr .v.r{color:#FF8A8A}
.legend{display:flex;gap:14px;font-size:10px;color:#5E7590;margin-bottom:9px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;
  vertical-align:middle;font-style:normal}
#ctrls{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:9px}
.crow label{font-size:10.5px;color:#7E93AC;width:52px;flex:none;letter-spacing:.03em}
.crow input[type=range]{flex:1;-webkit-appearance:none;height:2px;border-radius:1px;
  background:rgba(79,227,255,.24);outline:none}
.crow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;
  height:15px;border-radius:50%;background:#4FE3FF;border:2px solid #0A1020;
  box-shadow:0 0 0 1px rgba(79,227,255,.5)}
.crow .val{font-size:10.5px;color:#9EEBFF;width:34px;text-align:right;flex:none}
.seg{display:flex;border:1px solid rgba(79,227,255,.24);border-radius:12px;overflow:hidden}
.seg button{flex:1;height:26px;border:none;background:transparent;color:#6E839C;
  font-size:10.5px;font-family:inherit;letter-spacing:.03em;cursor:pointer}
.seg button.on{background:rgba(79,227,255,.17);color:#9EEBFF}
#target{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:25;
  border-radius:50%;border:1.5px solid rgba(255,209,102,.9);
  box-shadow:0 0 0 6px rgba(255,209,102,.10),0 0 18px rgba(255,209,102,.45);
  display:none;pointer-events:none}
#target::after{content:'';position:absolute;inset:11px;border-radius:50%;
  background:#FFD166}
#target.on{display:block;animation:tpulse 1.1s ease-in-out infinite}
@keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
#targetLock{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:25;
  border-radius:50%;border:1.5px solid rgba(126,230,168,.85);display:none;
  pointer-events:none}
#calNum{position:fixed;top:14%;left:0;right:0;text-align:center;z-index:26;
  font-size:12px;color:#8FA6C4;letter-spacing:.08em;display:none}
#calBar{position:fixed;bottom:16%;left:18%;right:18%;height:3px;z-index:26;
  background:rgba(79,227,255,.15);border-radius:2px;overflow:hidden;display:none}
#calFill{height:100%;width:0%;background:#4FE3FF;border-radius:2px}
.big{font-size:31px;font-weight:500;color:#CFE9FF;letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.big small{font-size:13px;color:#6E839C;margin-left:3px;letter-spacing:0}
.statRow{display:flex;gap:22px;margin:18px 0 6px;justify-content:center}
.stat{display:flex;flex-direction:column;gap:3px;align-items:center}
.stat .k{font-size:10.5px;color:#5E7590;letter-spacing:.06em}
.verdict{margin-top:16px;padding:11px 16px;border-radius:10px;font-size:12.5px;
  line-height:1.65;max-width:330px;letter-spacing:.02em}
.verdict.ok{background:rgba(126,230,168,.09);border:1px solid rgba(126,230,168,.28);color:#9DE8BC}
.verdict.mid{background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.28);color:#FFD98A}
.verdict.bad{background:rgba(255,138,138,.09);border:1px solid rgba(255,138,138,.26);color:#FFAFAF}
#err{color:#FF8A8A;font-size:11.5px;line-height:1.7;margin-top:14px;
  max-width:330px;display:none;white-space:pre-wrap;text-align:left}
.spin{width:26px;height:26px;border:1.5px solid rgba(79,227,255,.2);
  border-top-color:#4FE3FF;border-radius:50%;animation:sp .8s linear infinite;margin:18px 0 6px}
@keyframes sp{to{transform:rotate(360deg)}}
#bootHint{font-size:11px;color:#4E6178;margin-top:10px;height:16px;letter-spacing:.04em}
</style>
</head>
<body>

<canvas id="game"></canvas>
<video id="cam" class="hide" playsinline muted autoplay></video>

<div id="target"></div>
<div id="targetLock"></div>
<div id="calNum"></div>
<div id="calBar"><div id="calFill"></div></div>

<div id="hud" class="hide">
  <div class="hc">球速<div class="hv" id="hSpeed">105</div></div>
  <div class="hc">视线高度<div class="hv" id="hGazeY">--</div></div>
  <div class="hc">擦边<div class="hv" id="hGraze">0</div></div>
</div>

<div id="diag" class="hide fold">
  <div id="dHead">
    <span class="ttl">眼动诊断 · 点此展开调参</span>
    <span id="dFold" style="font-size:10px;color:#54687E;padding:2px 8px;border:1px solid rgba(143,166,196,.2);border-radius:9px">收起</span>
  </div>
  <div id="dRows">
    <div class="dr"><span class="k">检测帧率</span><span class="v" id="dFps">--</span></div>
    <div class="dr"><span class="k">中位误差</span><span class="v" id="dErr">--</span></div>
    <div class="dr"><span class="k">角度误差</span><span class="v" id="dDeg">--</span></div>
    <div class="dr"><span class="k">眨眼丢帧</span><span class="v" id="dBlink">--</span></div>
    <div class="dr"><span class="k">信号抖动</span><span class="v" id="dJit">--</span></div>
    <div class="dr"><span class="k">人脸状态</span><span class="v" id="dFace">--</span></div>
  </div>
  <div class="legend">
    <span><i style="background:#FF6B6B"></i>原始</span>
    <span><i style="background:#4FE3FF"></i>滤波后</span>
    <span><i style="background:#FFD166"></i>实际生效</span>
  </div>
  <div id="ctrls">
    <div class="crow"><label>速度</label><input type="range" id="sSpeed" min="50" max="200" step="5" value="105"><span class="val" id="vSpeed">105</span></div>
    <div class="crow"><label>缝宽</label><input type="range" id="sGap" min="140" max="360" step="10" value="230"><span class="val" id="vGap">230</span></div>
    <div class="crow"><label>吸附</label><input type="range" id="sAssist" min="0" max="100" step="5" value="65"><span class="val" id="vAssist">65%</span></div>
    <div class="crow" style="gap:8px">
      <label style="width:52px">控制律</label>
      <div class="seg" style="flex:1">
        <button data-law="A" class="on">A 直接映射</button>
        <button data-law="B">B 注视推杆</button>
      </div>
      <button id="btnRecal" style="height:26px;padding:0 10px;border-radius:9px;
        border:1px solid rgba(143,166,196,.24);background:transparent;color:#8FA6C4;
        font-size:10.5px;font-family:inherit;cursor:pointer;flex:none">重校</button>
    </div>
  </div>
</div>

<div id="scrBoot" class="scr">
  <h1>光球突围 · 眼动</h1>
  <div class="sub">手机前置摄像头 · 虹膜追踪<br>先校准，再看你自己能不能玩</div>
  <button class="btn" id="btnStart">启动摄像头</button>
  <div id="bootHint">需要 https 环境与摄像头权限</div>
  <div id="err"></div>
  <div class="note">画面与视线数据只在本机处理，不上传任何服务器。摄像头画面不会录制。</div>
</div>

<div id="scrCalib" class="scr solid hide">
  <div class="sub" style="font-size:13px;color:#9AB2CC">盯住金色圆点，不要移动头部</div>
  <div class="sub" style="font-size:11.5px;margin-top:6px;color:#5E7590">共 5 个点，每点停留约 2 秒</div>
  <div class="spin" id="calSpin"></div>
</div>

<div id="scrReport" class="scr hide">
  <div class="sub" style="font-size:13px;letter-spacing:.10em;color:#9AB2CC">校准完成 · 精度复测</div>
  <div class="big" id="rErr" style="margin-top:20px">--<small>px</small></div>
  <div class="sub" style="font-size:11px;margin-top:2px;color:#5E7590">逐帧瞬时偏差中位数</div>
  <div class="statRow">
    <div class="stat"><span class="k">角度误差</span><span style="font-size:16px;color:#CFE9FF" id="rDeg">--</span></div>
    <div class="stat"><span class="k">抖动 RMS</span><span style="font-size:16px;color:#CFE9FF" id="rJit">--</span></div>
    <div class="stat"><span class="k">游戏容差</span><span style="font-size:16px;color:#CFE9FF">±<span id="rTol">--</span></span></div>
  </div>
  <div class="verdict" id="rVerdict">--</div>
  <button class="btn gold" id="btnPlay">进入体验场</button>
  <button class="btn ghost" id="btnRecal2">重新校准</button>
</div>

<script>
/* MediaPipe 资源优先走同源（./mp/），同源缺失时自动回退到 jsDelivr CDN。
   同源的目的：避开跨境 CDN 链路，模型与页面走同一个全球 CDN 边缘节点。 */
window.__MP_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
window.__MP_BASE = new URL('./mp/', location.href).href;
</script>
<script src="./mp/face_mesh.js" onerror="(function(){window.__MP_BASE=window.__MP_CDN;var s=document.createElement('script');s.src=window.__MP_BASE+'face_mesh.js';s.crossOrigin='anonymous';document.head.appendChild(s);})()"></script>
<script>
(function(){
'use strict';

/* ============================================================
   0. 常量 / 状态
   ============================================================ */

var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d', { alpha: false });
var vid = document.getElementById('cam');

var DPR = 1, W = 0, H = 0;

/* 眼动参数（可在诊断面板实时调） */
var P = {
  speed   : 105,      // 卷轴速度 px/s
  gap     : 230,      // 缝隙高度 px
  assist  : 0.65,     // 通道吸附强度 0-1
  assistR : 90,       // 吸附作用半径 px
  law     : 'A'       // A 直接映射 / B 注视推杆
};

/* 运行时状态 */
var S = {
  phase     : 'boot',   // boot|calib|report|play
  camReady  : false,
  mpReady   : false,
  faceOk    : false,
  calibrated: false,
  faces     : 0,
  detectFps : 0,
  lastFaceAt: 0,
  blinkFrames: 0,
  totalFrames: 0,
  paused    : false
};

/* 视线三层信号（屏幕坐标 CSS px） */
var Gaze = {
  raw      : { x: 0, y: 0, ok: false },
  filt     : { x: 0, y: 0, ok: false },
  eff      : { x: 0, y: 0, ok: false },
  jitter   : 0,          // 高频抖动 RMS（px）
  lostMs   : 0,          // 连续丢帧时长
  vx       : 0, vy: 0
};

/* 校准模型：屏幕位置 = f(虹膜特征)，4 参数双线性 + 最小二乘 */
var Model = {
  a: null,               // [a0,a1,a2,a3]  → screenX(归一化)
  b: null,               // [b0,b1,b2,b3]  → screenY(归一化)
  mean: { x: 0, y: 0 }   // 特征中心化用
};

/* 精度指标 */
var Acc = {
  medianPx : 0,
  angleDeg : 0,
  jitterRms: 0,
  samples  : []
};

/* ============================================================
   1. 工具
   ============================================================ */

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function now(){ return performance.now(); }

/* 4x4（可变 n）最小二乘：解 A x = b，A 为 n×m，b 为 n×1 */
function solveLS(A, b, m){
  var n = A.length;
  var M = [], i, j, k;
  for (i = 0; i < m; i++){
    M.push(new Float64Array(m + 1));
  }
  /* 法方程 M = AᵀA, rhs = Aᵀb */
  for (i = 0; i < m; i++){
    for (j = 0; j < m; j++){
      var s = 0;
      for (k = 0; k < n; k++) s += A[k][i] * A[k][j];
      M[i][j] = s;
    }
    var t = 0;
    for (k = 0; k < n; k++) t += A[k][i] * b[k];
    M[i][m] = t;
  }
  /* 高斯消元 + 部分选主元 */
  for (i = 0; i < m; i++){
    var mx = i;
    for (j = i + 1; j < m; j++){
      if (Math.abs(M[j][i]) > Math.abs(M[mx][i])) mx = j;
    }
    if (Math.abs(M[mx][i]) < 1e-12) return null;
    var tmp = M[i]; M[i] = M[mx]; M[mx] = tmp;
    var pv = M[i][i];
    for (j = i; j <= m; j++) M[i][j] /= pv;
    for (j = 0; j < m; j++){
      if (j === i) continue;
      var f = M[j][i];
      if (f === 0) continue;
      for (k = i; k <= m; k++) M[j][k] -= f * M[i][k];
    }
  }
  var out = [];
  for (i = 0; i < m; i++) out.push(M[i][m]);
  return out;
}

/* one-euro 滤波器：眼动信号标准配置 */
function OneEuro(mc, beta, dc){
  this.mc = mc; this.beta = beta; this.dc = dc;
  this.xp = null; this.dxp = 0;
}
OneEuro.prototype.alpha = function(cut, dt){
  var tau = 1 / (2 * Math.PI * cut);
  return 1 / (1 + tau / dt);
};
OneEuro.prototype.filter = function(x, dt){
  if (this.xp === null){ this.xp = x; this.dxp = 0; return x; }
  var dx = (x - this.xp) / dt;
  var ad = this.alpha(this.dc, dt);
  this.dxp = this.dxp + ad * (dx - this.dxp);
  var cut = this.mc + this.beta * Math.abs(this.dxp);
  var a = this.alpha(cut, dt);
  this.xp = this.xp + a * (x - this.xp);
  return this.xp;
};
OneEuro.prototype.reset = function(){ this.xp = null; this.dxp = 0; };

var F = {
  x: new OneEuro(1.1, 0.045, 1.0),
  y: new OneEuro(1.1, 0.045, 1.0)
};

function resetFilters(){ F.x.reset(); F.y.reset(); }

/* ============================================================
   2. 画布
   ============================================================ */

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){
  setTimeout(resize, 180);
});

/* ============================================================
   3. 星域背景
   ============================================================ */

var stars = [];
function buildStars(){
  stars = [];
  var n = Math.round(W * H / 9000);
  for (var i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: 0.25 + Math.random() * 0.75,
      r: 0.4 + Math.random() * 1.1
    });
  }
}

/* ============================================================
   4. 游戏世界
   ============================================================ */

var PLAY = { top: 76, bottom: 0 };
function updatePlay(){ PLAY.bottom = H - 132; }

var Wd = {
  ready   : false,
  ballY   : 0,
  ballVY  : 0,
  ballX   : 0,
  camX    : 0,
  obs     : [],
  cursor  : 0,
  grazes  : 0,
  travel  : 0,
  t       : 0,
  gapCache: null
};

function worldReset(keepStats){
  updatePlay();
  Wd.ballX = Math.max(72, W * 0.24);
  Wd.ballY = (PLAY.top + PLAY.bottom) / 2;
  Wd.ballVY = 0;
  Wd.camX = 0; Wd.cursor = W + 260;
  Wd.obs = []; Wd.travel = 0; Wd.t = 0;
  if (!keepStats) Wd.grazes = 0;
  Wd.gapCache = null;
  Wd.ready = true;
  while (Wd.cursor < Wd.camX + W * 2.2) genGate(Wd.cursor);
}

function genGate(atX){
  var gapH = P.gap * (0.94 + Math.random() * 0.14);
  gapH = clamp(gapH, 130, (PLAY.bottom - PLAY.top) * 0.78);
  var span = PLAY.bottom - PLAY.top;
  var c = PLAY.top + gapH / 2 + Math.random() * (span - gapH);
  c = clamp(c, PLAY.top + gapH / 2, PLAY.bottom - gapH / 2);

  var w = 54 + Math.random() * 16;
  Wd.obs.push({
    type : 'gate',
    sx   : atX,
    w    : w,
    gapC : c,
    gapH : gapH,
    grazeCd: 0
  });

  Wd.cursor = atX + w + P.speed * (1.55 + Math.random() * 0.55);
  return Wd.cursor;
}

function nearestGate(){
  var best = null, bestD = Infinity;
  for (var i = 0; i < Wd.obs.length; i++){
    var o = Wd.obs[i];
    var ox = o.sx - Wd.camX;
    if (ox + o.w < Wd.ballX - 4) continue;
    var d = ox - Wd.ballX;
    if (d < bestD){ bestD = d; best = o; }
  }
  return best;
}

/* 通道吸附：视线进入缝隙中心 R 半径内，软拉向中心 */
function applyAssist(targetY){
  var g = nearestGate();
  Wd.gapCache = g;
  if (!g || P.assist <= 0) return targetY;
  var d = Math.abs(targetY - g.gapC);
  if (d > P.assistR) return targetY;
  var wgt = 1 - d / P.assistR;
  return targetY + (g.gapC - targetY) * wgt * P.assist;
}

function updateWorld(dt){
  if (!Wd.ready) return;
  Wd.t += dt;
  Wd.camX += P.speed * dt;
  Wd.travel = Wd.camX;

  /* 生成新墙 */
  while (Wd.cursor < Wd.camX + W * 2.2){
    genGate(Wd.cursor);
  }
  /* 回收 */
  while (Wd.obs.length && Wd.obs[0].sx - Wd.camX + Wd.obs[0].w < -80){
    Wd.obs.shift();
  }

  /* --- 控制 --- */
  var targetY = Wd.ballY;

  if (Gaze.eff.ok){
    if (P.law === 'A'){
      targetY = clamp(Gaze.eff.y, PLAY.top + 12, PLAY.bottom - 12);
      targetY = applyAssist(targetY);
      /* 临界阻尼弹簧跟手 */
      var k = 2400, c = 2 * Math.sqrt(k) * 0.92;
      var acc = (targetY - Wd.ballY) * k - Wd.ballVY * c;
      Wd.ballVY += acc * dt;
      Wd.ballY  += Wd.ballVY * dt;
    } else {
      /* B：注视偏离球 → 持续推力 */
      var off = Gaze.eff.y - Wd.ballY;
      var push = clamp(off * 9.5, -1500, 1500);
      var g2 = nearestGate();
      Wd.gapCache = g2;
      if (g2 && P.assist > 0){
        var dd = Math.abs(Wd.ballY - g2.gapC);
        if (dd < P.assistR){
          var ww = 1 - dd / P.assistR;
          push += (g2.gapC - Wd.ballY) * 5.2 * ww * P.assist;
        }
      }
      Wd.ballVY += push * dt;
      Wd.ballVY *= Math.pow(0.0016, dt);
      Wd.ballY  += Wd.ballVY * dt;
    }
  } else {
    /* 丢帧：速度衰减，缓慢停住，不失控 */
    Wd.ballVY *= Math.pow(0.02, dt);
    Wd.ballY  += Wd.ballVY * dt;
  }

  Wd.ballY = clamp(Wd.ballY, PLAY.top + 11, PLAY.bottom - 11);

  /* --- 碰撞 / 擦边 --- */
  var R = 10;
  for (var i = 0; i < Wd.obs.length; i++){
    var o = Wd.obs[i];
    if (o.grazeCd > 0) o.grazeCd -= dt;
    var ox = o.sx - Wd.camX;
    if (Wd.ballX + R < ox || Wd.ballX - R > ox + o.w) continue;

    var dTop = Math.abs(Wd.ballY - (o.gapC - o.gapH / 2));
    var dBot = Math.abs(Wd.ballY - (o.gapC + o.gapH / 2));

    if (Wd.ballY < o.gapC - o.gapH / 2 + R || Wd.ballY > o.gapC + o.gapH / 2 - R){
      /* 撞墙：不做结算打断，直接就地重来，保持体验节奏 */
      Burst.emit(Wd.ballX, Wd.ballY, 22, '#FF6B6B');
      worldReset(true);
      resetFilters();
      return;
    }
    var minD = Math.min(dTop, dBot);
    if (minD < 34 && o.grazeCd <= 0){
      o.grazeCd = 0.5;
      Wd.grazes++;
      Burst.emit(Wd.ballX, Wd.ballY, 10, '#FFD166');
    }
  }
}

/* ============================================================
   5. 粒子
   ============================================================ */

var Burst = {
  ps: [],
  emit: function(x, y, n, color){
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = 30 + Math.random() * 130;
      this.ps.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0, max: 0.35 + Math.random() * 0.5,
        color: color, r: 1 + Math.random() * 1.8
      });
    }
  },
  update: function(dt){
    for (var i = this.ps.length - 1; i >= 0; i--){
      var p = this.ps[i];
      p.life += dt;
      if (p.life >= p.max){ this.ps.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
      p.vy += 40 * dt;
    }
  },
  draw: function(){
    var g = ctx.globalAlpha;
    for (var i = 0; i < this.ps.length; i++){
      var p = this.ps[i];
      ctx.globalAlpha = (1 - p.life / p.max) * 0.9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = g;
  }
};

/* ============================================================
   6. 渲染
   ============================================================ */

var trail = [];

function render(){
  /* 背景 */
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#080C18');
  bg.addColorStop(0.55, '#060911');
  bg.addColorStop(1, '#0A0E1C');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 星点视差 */
  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    var sx = (s.x - Wd.camX * s.z * 0.16) % W;
    if (sx < 0) sx += W;
    ctx.globalAlpha = 0.16 + s.z * 0.42;
    ctx.fillStyle = s.z > 0.7 ? '#9FD8F5' : '#4A6080';
    ctx.beginPath();
    ctx.arc(sx, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (S.phase !== 'play' || !Wd.ready) return;

  /* 墙 */
  for (var j = 0; j < Wd.obs.length; j++){
    var o = Wd.obs[j];
    var ox = o.sx - Wd.camX;
    if (ox > W + 40 || ox + o.w < -40) continue;
    if (o.type === 'gate'){
      var gTop = o.gapC - o.gapH / 2;
      var gBot = o.gapC + o.gapH / 2;
      paintWall(ox, -60, o.w, gTop + 60, gTop);
      paintWall(ox, gBot, o.w, PLAY.bottom + 70 - gBot, gBot);
      /* 缝隙高光 */
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.34 + Math.sin(Wd.t * 4.2) * 0.10;
      var lg = ctx.createLinearGradient(ox, 0, ox + o.w, 0);
      lg.addColorStop(0, 'rgba(255,209,102,0)');
      lg.addColorStop(0.5, 'rgba(255,209,102,0.55)');
      lg.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(ox, gTop, o.w, gBot - gTop);
      ctx.restore();
    } else if (o.type === 'flash'){
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#FF6B6B';
      ctx.fillRect(ox, 0, o.w, H);
      ctx.restore();
    }
  }

  /* 前瞻引导线 */
  if (Wd.gapCache){
    var gx = Wd.gapCache.sx - Wd.camX;
    ctx.save();
    ctx.setLineDash([4, 9]);
    ctx.strokeStyle = 'rgba(255,209,102,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Wd.ballX, Wd.ballY);
    ctx.lineTo(gx, Wd.gapCache.gapC);
    ctx.stroke();
    ctx.restore();
  }

  /* 视线横向指示线 */
  if (Gaze.eff.ok && S.phase === 'play'){
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#FFD166';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Wd.ballX + 14, Gaze.eff.y);
    ctx.lineTo(W, Gaze.eff.y);
    ctx.stroke();
    ctx.restore();
  }

  /* 光球拖尾 */
  trail.push({ x: Wd.ballX, y: Wd.ballY });
  if (trail.length > 16) trail.shift();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var k = 0; k < trail.length; k++){
    var tp = trail[k];
    var a = (k / trail.length) * 0.34;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#4FE3FF';
    ctx.beginPath();
    ctx.arc(tp.x, tp.y, 3.5 + a * 8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  /* 光球本体 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var gr = ctx.createRadialGradient(Wd.ballX, Wd.ballY, 0, Wd.ballX, Wd.ballY, 34);
  gr.addColorStop(0, 'rgba(190,245,255,0.95)');
  gr.addColorStop(0.30, 'rgba(79,227,255,0.44)');
  gr.addColorStop(1, 'rgba(79,227,255,0)');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.arc(Wd.ballX, Wd.ballY, 34, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#EAFBFF';
  ctx.beginPath();
  ctx.arc(Wd.ballX, Wd.ballY, 6.5, 0, Math.PI * 2);
  ctx.fill();

  Burst.draw();

  /* --- 眼动三层信号可视化 --- */
  if (S.phase === 'play'){
    drawGazeDot(Gaze.raw.x, Gaze.raw.y, 8,  'rgba(255,107,107,0.55)', 'rgba(255,107,107,0.9)');
    drawGazeDot(Gaze.filt.x, Gaze.filt.y, 7, 'rgba(79,227,255,0.30)',  'rgba(79,227,255,0.95)');
    drawGazeDot(Gaze.eff.x, Gaze.eff.y, 5,  'rgba(255,209,102,0.40)', 'rgba(255,209,102,1)');
  }
}

function drawGazeDot(x, y, r, fill, stroke){
  if (!isFinite(x) || !isFinite(y)) return;
  ctx.save();
  ctx.strokeStyle = stroke;
  ctx.fillStyle = fill;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function paintWall(sx, y, w, h, lipY){
  if (h <= 0) return;
  ctx.fillStyle = 'rgba(11,18,32,0.95)';
  ctx.fillRect(sx, y, w, h);

  var gy = ctx.createLinearGradient(sx, 0, sx + w, 0);
  gy.addColorStop(0, 'rgba(79,227,255,0.13)');
  gy.addColorStop(0.5, 'rgba(79,227,255,0.03)');
  gy.addColorStop(1, 'rgba(79,227,255,0.16)');
  ctx.fillStyle = gy;
  ctx.fillRect(sx, y, w, h);

  ctx.strokeStyle = 'rgba(79,227,255,0.55)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(sx + 0.8, y); ctx.lineTo(sx + 0.8, y + h);
  ctx.moveTo(sx + w - 0.8, y); ctx.lineTo(sx + w - 0.8, y + h);
  ctx.stroke();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(150,242,255,0.92)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(sx, lipY); ctx.lineTo(sx + w, lipY); ctx.stroke();
  ctx.globalAlpha = 0.18;
  ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(sx, lipY); ctx.lineTo(sx + w, lipY); ctx.stroke();
  ctx.restore();
}

/* ============================================================
   7. 主循环
   ============================================================ */

var lastT = 0, accT = 0;
var FIXED = 1 / 120;

function loop(ts){
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;

  if (S.phase === 'play'){
    accT += dt;
    var guard = 0;
    while (accT >= FIXED && guard++ < 8){
      updateWorld(FIXED);
      accT -= FIXED;
    }
    Burst.update(dt);
  }
  render();
}
requestAnimationFrame(loop);

/* ============================================================
   8. 摄像头 + MediaPipe
   ============================================================ */

var LM = {
  R_OUTER: 33, R_INNER: 133, R_TOP: 159, R_BOT: 145, R_IRIS: 468,
  L_OUTER: 263, L_INNER: 362, L_TOP: 386, L_BOT: 374, L_IRIS: 473
};

var faceMesh = null;
var detectBusy = false;
var lastDetectT = 0;
var detectCount = 0;
var fpsT0 = 0;

function bootFaceMesh(){
  if (typeof window.FaceMesh !== 'function'){
    return Promise.reject(new Error('MediaPipe 脚本未加载，请检查网络后刷新'));
  }
  faceMesh = new window.FaceMesh({
    locateFile: function(f){
      return window.__MP_BASE + f;
    }
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  faceMesh.onResults(onFace);
  return faceMesh.initialize().then(function(){
    S.mpReady = true;
  });
}

function startCamera(){
  var c = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  if (!c) return Promise.reject(new Error('浏览器不支持摄像头调用'));
  if (!window.isSecureContext){
    return Promise.reject(new Error('当前不是安全环境（https），浏览器禁止调用摄像头'));
  }
  return navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      facingMode: 'user',
      width : { ideal: 640 },
      height: { ideal: 480 },
      frameRate: { ideal: 30, max: 30 }
    }
  }).then(function(stream){
    vid.srcObject = stream;
    return vid.play();
  }).then(function(){
    S.camReady = true;
    vid.classList.remove('hide');
  });
}

function pumpDetect(){
  requestAnimationFrame(pumpDetect);
  if (!S.camReady || !S.mpReady || detectBusy) return;
  if (vid.readyState < 2 || vid.videoWidth === 0) return;
  detectBusy = true;
  var t0 = now();
  faceMesh.send({ image: vid }).then(function(){
    detectBusy = false;
    detectCount++;
    var dt = now() - fpsT0;
    if (dt > 700){
      S.detectFps = Math.round(detectCount * 1000 / dt);
      detectCount = 0; fpsT0 = now();
    }
  }).catch(function(){
    detectBusy = false;
  });
}

/* 从 478 点提取双眼虹膜归一化坐标 */
function extractFeat(lm){
  function eye(outer, inner, top, bot, iris){
    var o = lm[outer], i = lm[inner], t = lm[top], b = lm[bot], c = lm[iris];
    if (!o || !i || !t || !b || !c) return null;
    var ux = i.x - o.x, uy = i.y - o.y;
    var wx = b.x - t.x, wy = b.y - t.y;
    var du = ux * ux + uy * uy;
    var dw = wx * wx + wy * wy;
    if (du < 1e-9 || dw < 1e-9) return null;
    return {
      ax  : ((c.x - o.x) * ux + (c.y - o.y) * uy) / du,
      ay  : ((c.x - t.x) * wx + (c.y - t.y) * wy) / dw,
      open: Math.sqrt(dw) / Math.sqrt(du)
    };
  }
  var r = eye(LM.R_OUTER, LM.R_INNER, LM.R_TOP, LM.R_BOT, LM.R_IRIS);
  var l = eye(LM.L_OUTER, LM.L_INNER, LM.L_TOP, LM.L_BOT, LM.L_IRIS);
  if (!r || !l) return null;
  return {
    ax  : (r.ax + l.ax) / 2,
    ay  : (r.ay + l.ay) / 2,
    open: Math.min(r.open, l.open)
  };
}

/* 特征 → 屏幕归一化坐标 */
function predict(fx, fy){
  if (!Model.a) return null;
  var x = fx - Model.mean.x;
  var y = fy - Model.mean.y;
  var v = [1, x, y, x * y];
  var sx = 0, sy = 0;
  for (var i = 0; i < 4; i++){ sx += v[i] * Model.a[i]; sy += v[i] * Model.b[i]; }
  return { sx: sx, sy: sy };
}

/* 校准样本缓冲 */
var calBuf = [];
var calActive = false;

function onFace(res){
  S.totalFrames++;
  var lms = res.multiFaceLandmarks;

  if (!lms || !lms.length){
    S.faces = 0;
    S.faceOk = false;
    S.blinkFrames++;
    Gaze.lostMs += 33;
    return;
  }
  S.faces = 1;
  S.faceOk = true;
  S.lastFaceAt = now();

  var lm = lms[0];
  var f = extractFeat(lm);
  if (!f) return;

  /* 眨眼门控：眼睑开度过低视为闭眼，不更新 */
  if (f.open < 0.105){
    S.blinkFrames++;
    return;
  }

  /* 校准采样 */
  if (calActive) calBuf.push(f);

  if (!S.calibrated) return;

  var p = predict(f.ax, f.ay);
  if (!p) return;

  var sx = p.sx * W;
  var sy = p.sy * H;
  if (!isFinite(sx) || !isFinite(sy)) return;

  /* 越界保护：不允许视线飞出屏幕太远 */
  sx = clamp(sx, -W * 0.3, W * 1.3);
  sy = clamp(sy, -H * 0.3, H * 1.3);

  Gaze.raw.x = sx; Gaze.raw.y = sy; Gaze.raw.ok = true;

  /* 滤波 */
  var dt = Math.min(0.2, Math.max(0.008, (now() - (onFace._t || now())) / 1000));
  onFace._t = now();

  var fx2 = F.x.filter(sx, dt);
  var fy2 = F.y.filter(sy, dt);

  /* 抖动估计：滤波前后差值的滑动 RMS */
  var jx = sx - fx2, jy = sy - fy2;
  Gaze.jitter = Gaze.jitter * 0.88 + Math.sqrt(jx * jx + jy * jy) * 0.12;

  Gaze.filt.x = fx2; Gaze.filt.y = fy2; Gaze.filt.ok = true;

  /* 生效层（吸附后） */
  var ey = clamp(fy2, PLAY.top + 10, PLAY.bottom - 10);
  if (S.phase === 'play') ey = applyAssist(ey);
  Gaze.eff.x = Gaze.raw.x;
  Gaze.eff.y = ey;
  Gaze.eff.ok = true;
  Gaze.lostMs = 0;
}

/* ============================================================
   9. 校准流程
   ============================================================ */

var CAL_PTS = [
  { x: 0.16, y: 0.16 },
  { x: 0.84, y: 0.16 },
  { x: 0.50, y: 0.50 },
  { x: 0.16, y: 0.84 },
  { x: 0.84, y: 0.84 }
];

var elTarget = document.getElementById('target');
var elCalNum = document.getElementById('calNum');
var elCalBar = document.getElementById('calBar');
var elCalFill = document.getElementById('calFill');

function showTarget(nx, ny){
  elTarget.style.left = (nx * W) + 'px';
  elTarget.style.top  = (ny * H) + 'px';
  elTarget.classList.add('on');
}
function hideTarget(){ elTarget.classList.remove('on'); }

function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function sleepUntilReady(){
  return new Promise(function(resolve){
    var t0 = now();
    (function chk(){
      if (S.faceOk || S.detectFps > 0) return resolve();
      if (now() - t0 > 20000) return resolve();
      setTimeout(chk, 120);
    })();
  });
}

function runCalibration(){
  S.phase = 'calib';
  document.getElementById('scrCalib').classList.remove('hide');
  document.getElementById('scrReport').classList.add('hide');
  document.getElementById('hud').classList.add('hide');
  document.getElementById('diag').classList.add('hide');
  document.getElementById('calNum').style.display = 'block';
  document.getElementById('calBar').style.display = 'block';
  document.getElementById('calSpin').style.display = 'block';
  document.getElementById('calNum').textContent = '等待面部识别…';

  Model.a = null; Model.b = null;
  S.calibrated = false;
  resetFilters();

  return sleepUntilReady().then(function(){
    document.getElementById('calSpin').style.display = 'none';
    var A = [], bx = [], by = [];
    var feats = [];

    function step(i){
      if (i >= CAL_PTS.length){
        return Promise.resolve();
      }
      var pt = CAL_PTS[i];
      elCalNum.textContent = '校准点 ' + (i + 1) + ' / ' + CAL_PTS.length;
      showTarget(pt.x, pt.y);
      elCalFill.style.width = (i / CAL_PTS.length * 100) + '%';

      return wait(600).then(function(){
        calBuf = [];
        calActive = true;
        var t0 = now();
        return new Promise(function(res){
          (function tick(){
            var el = now() - t0;
            elCalFill.style.width = ((i + el / 1800) / CAL_PTS.length * 100) + '%';
            if (el >= 1200) return res();
            setTimeout(tick, 60);
          })();
        });
      }).then(function(){
        calActive = false;
        var n = calBuf.length;
        if (n < 3){
          feats.push(null);
          return step(i + 1);
        }
        /* 取中位数，抗离群 */
        var axs = calBuf.map(function(v){ return v.ax; }).sort(function(a,b){ return a-b; });
        var ays = calBuf.map(function(v){ return v.ay; }).sort(function(a,b){ return a-b; });
        var mx = axs[Math.floor(n / 2)], my = ays[Math.floor(n / 2)];
        feats.push({ ax: mx, ay: my, tx: pt.x, ty: pt.y });
        return step(i + 1);
      });
    }

    hideTarget();
    return step(0).then(function(){
      elCalBar.style.display = 'none';
      elCalNum.style.display = 'none';
      hideTarget();

      var good = feats.filter(function(v){ return v; });
      if (good.length < 4){
        return Promise.reject(new Error('有效校准点不足（' + good.length +
          '/5），请确保正脸入镜、光线充足、不要戴反光眼镜'));
      }

      Model.mean.x = good.reduce(function(s,v){ return s + v.ax; }, 0) / good.length;
      Model.mean.y = good.reduce(function(s,v){ return s + v.ay; }, 0) / good.length;

      for (var i2 = 0; i2 < good.length; i2++){
        var g = good[i2];
        var x = g.ax - Model.mean.x, y = g.ay - Model.mean.y;
        A.push([1, x, y, x * y]);
        bx.push(g.tx);
        by.push(g.ty);
      }

      var sa = solveLS(A, bx, 4);
      var sb = solveLS(A, by, 4);
      if (!sa || !sb){
        return Promise.reject(new Error('校准方程退化——特征动态范围过小，可能是眼动信号未被正确捕捉，请正对镜头重试'));
      }
      Model.a = sa; Model.b = sb;
      S.calibrated = true;
      return true;
    });
  }).then(function(){
    return runAccuracyTest();
  }).catch(function(e){
    fail(e.message);
  });
}

/* ============================================================
   10. 精度复测
   ============================================================ */

function runAccuracyTest(){
  S.phase = 'report';
  document.getElementById('scrCalib').classList.add('hide');
  document.getElementById('calBar').style.display = 'block';
  document.getElementById('calNum').style.display = 'block';
  elCalFill.style.width = '0%';

  /* 复测点刻意避开校准点，取插值位置，否则精度会虚高 */
  var pts = [
    { x: 0.30, y: 0.28 }, { x: 0.70, y: 0.28 },
    { x: 0.50, y: 0.52 },
    { x: 0.30, y: 0.72 }, { x: 0.70, y: 0.72 }
  ];
  var errs = [], jits = [];
  resetFilters();

  function step(i){
    if (i >= pts.length) return Promise.resolve();
    var pt = pts[i];
    elCalNum.textContent = '复测 ' + (i + 1) + ' / ' + pts.length;
    showTarget(pt.x, pt.y);

    return wait(500).then(function(){
      var t0 = now();
      var frameErr = [], jitAcc = 0, jitN = 0;
      return new Promise(function(res){
        (function tick(){
          if (Gaze.raw.ok){
            var dx = Gaze.raw.x - pt.x * W;
            var dy = Gaze.raw.y - pt.y * H;
            frameErr.push(Math.hypot(dx, dy));   /* 逐帧瞬时偏差，不用均值 */
            if (Gaze.filt.ok) jitAcc += Math.hypot(Gaze.raw.x - Gaze.filt.x, Gaze.raw.y - Gaze.filt.y);
            jitN++;
          }
          var el = now() - t0;
          elCalFill.style.width = ((i + el / 1400) / pts.length * 100) + '%';
          if (el >= 1100) return res();
          setTimeout(tick, 50);
        })();
      }).then(function(){
        if (frameErr.length > 5){
          frameErr.sort(function(a, b){ return a - b; });
          errs.push(frameErr[Math.floor(frameErr.length / 2)]);
          if (jitN > 5) jits.push(jitAcc / jitN);
        }
      });
    }).then(function(){ return step(i + 1); });
  }

  return step(0).then(function(){
    hideTarget();
    elCalBar.style.display = 'none';
    elCalNum.style.display = 'none';

    if (errs.length < 3){
      return Promise.reject(new Error('复测样本不足，视线未能稳定捕捉'));
    }
    errs.sort(function(a, b){ return a - b; });
    Acc.medianPx = errs[Math.floor(errs.length / 2)];
    jits.sort(function(a, b){ return a - b; });
    Acc.jitterRms = jits.length ? jits[Math.floor(jits.length / 2)] : 0;

    /* 角度：Android CSS px ≈ 0.15875mm（1dp），视距按 35cm 估 */
    var mmPerPx = 0.15875;
    var distMm = 350;
    Acc.angleDeg = Math.atan((Acc.medianPx * mmPerPx) / distMm) * 180 / Math.PI;

    showReport();
    return true;
  });
}

function showReport(){
  S.phase = 'report';
  document.getElementById('scrReport').classList.remove('hide');

  document.getElementById('rErr').innerHTML =
    Math.round(Acc.medianPx) + '<small>px</small>';
  document.getElementById('rDeg').textContent = Acc.angleDeg.toFixed(1) + '°';
  document.getElementById('rJit').textContent = Math.round(Acc.jitterRms) + 'px';

  /* 眼动版容差 = 缝宽/2 - 球半径 */
  var tol = Math.round(P.gap / 2 - 10);
  document.getElementById('rTol').textContent = tol;

  var el = document.getElementById('rVerdict');
  var ratio = Acc.medianPx / tol;
  var cls, txt;
  if (ratio < 0.45){
    cls = 'ok';
    txt = '瞬时偏差 ' + Math.round(Acc.medianPx) + 'px，容差 ±' + tol +
      'px，占 ' + Math.round(ratio * 100) + '%。吸附打开后能稳定过关，这套方案可行。';
  } else if (ratio < 1.0){
    cls = 'mid';
    txt = '瞬时偏差 ' + Math.round(Acc.medianPx) + 'px，容差 ±' + tol +
      'px，占 ' + Math.round(ratio * 100) + '%。处在临界带，靠吸附能撑住，但你会在边沿反复挣扎——这就是眼动的真实手感。';
  } else {
    cls = 'bad';
    txt = '瞬时偏差 ' + Math.round(Acc.medianPx) + 'px，已超容差 ±' + tol +
      'px（' + Math.round(ratio * 100) + '%）。靠吸附也压不住，说明当前光线/距离/角度条件不适合，换个环境重校会好很多。';
  }
  el.className = 'verdict ' + cls;
  el.textContent = txt;
}

/* ============================================================
   11. 诊断面板刷新
   ============================================================ */

var elDiag = document.getElementById('diag');
var diagTimer = setInterval(function(){
  if (S.phase !== 'play') return;

  document.getElementById('dFps').textContent = S.detectFps + ' Hz';
  document.getElementById('dFps').className = 'v ' + (S.detectFps >= 18 ? 'g' : (S.detectFps >= 10 ? 'y' : 'r'));

  var e = Math.round(Acc.medianPx);
  document.getElementById('dErr').textContent = e + ' px';
  document.getElementById('dDeg').textContent = Acc.angleDeg.toFixed(1) + '°';
  document.getElementById('dDeg').className = 'v ' + (Acc.angleDeg < 2 ? 'g' : (Acc.angleDeg < 4 ? 'y' : 'r'));

  var blinkRate = S.totalFrames ? Math.round(S.blinkFrames / S.totalFrames * 100) : 0;
  document.getElementById('dBlink').textContent = blinkRate + '%';
  document.getElementById('dBlink').className = 'v ' + (blinkRate < 18 ? 'g' : (blinkRate < 35 ? 'y' : 'r'));

  document.getElementById('dJit').textContent = Math.round(Gaze.jitter) + ' px';

  var fEl = document.getElementById('dFace');
  if (!S.faceOk){
    fEl.textContent = '丢失';
    fEl.className = 'v r';
  } else if (S.detectFps < 8){
    fEl.textContent = '卡顿';
    fEl.className = 'v y';
  } else {
    fEl.textContent = '正常';
    fEl.className = 'v g';
  }

  document.getElementById('hSpeed').textContent = P.speed;
  document.getElementById('hGraze').textContent = Wd.grazes;
  document.getElementById('hGazeY').textContent =
    Gaze.eff.ok ? Math.round(Gaze.eff.y) + 'px' : '--';

  S.blinkFrames = 0; S.totalFrames = 0;
}, 500);

function fail(msg){
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '⚠ ' + msg;
  document.getElementById('scrBoot').classList.remove('hide');
  document.getElementById('scrCalib').classList.add('hide');
  document.getElementById('scrReport').classList.add('hide');
  S.phase = 'boot';
}

var elBtnStart = document.getElementById('btnStart');
var elHint = document.getElementById('bootHint');

elBtnStart.addEventListener('click', function(){
  elBtnStart.disabled = true;
  elHint.textContent = '正在请求摄像头…';
  document.getElementById('err').style.display = 'none';

  startCamera().then(function(){
    elHint.textContent = '正在加载虹膜模型…';
    return bootFaceMesh();
  }).then(function(){
    elHint.textContent = '正在识别面部…';
    window.__pumpStarted = true;
    return sleepUntilReady();
  }).then(function(){
    if (!S.faceOk){
      throw new Error('未检测到人脸。请确认：光线充足、正对镜头、整张脸在预览框内');
    }
    elHint.textContent = '';
    elBtnStart.disabled = false;
    runCalibration();
  }).catch(function(e){
    elBtnStart.disabled = false;
    fail(e && e.message ? e.message : String(e));
  });
});

document.getElementById('btnPlay').addEventListener('click', function(){
  document.getElementById('scrReport').classList.add('hide');
  enterPlay();
});

document.getElementById('btnRecal2').addEventListener('click', function(){
  runCalibration();
});

document.getElementById('btnRecal').addEventListener('click', function(){
  document.getElementById('diag').classList.remove('hide');
  runCalibration();
});

function enterPlay(){
  S.phase = 'play';
  worldReset();
  resetFilters();
  trail = [];
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('diag').classList.remove('hide');
}

/* 参数滑块 */
function bindSlider(id, valId, key, fmt){
  var el = document.getElementById(id);
  var ve = document.getElementById(valId);
  el.addEventListener('input', function(){
    var v = parseInt(el.value, 10);
    if (key === 'assist'){ P.assist = v / 100; ve.textContent = v + '%'; }
    else { P[key] = v; ve.textContent = v; }
    if (key === 'gap'){ Wd.cursor = Math.max(Wd.cursor, Wd.camX + W * 1.15); }
  });
}
bindSlider('sSpeed', 'vSpeed', 'speed');
bindSlider('sGap', 'vGap', 'gap');
bindSlider('sAssist', 'vAssist', 'assist');

document.querySelectorAll('.seg button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.seg button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    P.law = b.getAttribute('data-law');
  });
});

var elDFold = document.getElementById('dFold');
var elDTtl = document.querySelector('#dHead .ttl');
function syncDiagLabel(){
  var folded = document.getElementById('diag').classList.contains('fold');
  elDFold.textContent = folded ? '展开' : '收起';
  elDTtl.textContent = folded ? '眼动诊断 · 点此展开调参' : '眼动诊断';
}
document.getElementById('dHead').addEventListener('click', function(e){
  if (e.target === elDFold) return;
  document.getElementById('diag').classList.toggle('fold');
  syncDiagLabel();
});
elDFold.addEventListener('click', function(e){
  e.stopPropagation();
  document.getElementById('diag').classList.toggle('fold');
  syncDiagLabel();
});
syncDiagLabel();

};
