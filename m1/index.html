<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070a10;color:#e8eef7;overflow:hidden;overscroll-behavior:none;

/* 仪器模式的视觉参照必须画在 DOM 上。
   原来画在 canvas 里，而 .scr 遮罩是不透明黑底 + z-index:20，整块 canvas 被盖住，
   玩家看到的只有纯黑 —— 提示语让「盯着中央的十字」，屏幕上却什么都没有。
   这两层放在 #scrInstr 内部且不带 z-index，靠 DOM 顺序压在标题/卡片之下。 */
#insFix,#insZones{position:fixed;inset:0;pointer-events:none;display:none;z-index:0}
/* 定位元素永远绘制在非定位元素之上，光靠 DOM 顺序压不住青色带。
   给面板内容补 relative + z-index，数据卡与按钮才不会被青色盖掉。 */

#insFix.on{display:block}

#insFix::before{left:50%;top:50%;width:52px;height:1.5px;margin:-.75px 0 0 -26px}

#insZones i{flex:1;position:relative;transition:background .07s,box-shadow .07s}
#insZones i.on{background:rgba(34,198,208,.26);

/* 标签放低一些，避开上方提示语与中部数据卡，保证「亮在哪一区」始终看得见 */
#insZones i.on::after{content:attr(data-lbl);position:absolute;left:0;right:0;top:76%;
  transform:translateY(-50%);text-align:center;font-size:30px;font-weight:700;

.row{display:flex;gap:10px}
.row>*{flex:1}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:#16202c;color:#7f93aa;margin-right:6px}

#degBtn{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 116px);z-index:30;display:none;
  padding:10px 14px;border-radius:12px;border:1px solid #7d2b2b;background:rgba(35,14,15,.92);color:#ffb9b6;

<script>
/* MediaPipe 资源：本地用 ./mp/，部署在 /m1/ 子目录时用 ../mp/，再不行回退 CDN。
   同源的目的：模型与页面走同一个边缘节点，避开跨境链路中断。
   注意：这里必须用 Script 标签动态加载，不能用 <script onerror="..."> 属性里的
   new URL()——内联事件处理器的作用域链上有 document，document.URL 是一个字符串，
   会把 window.URL 这个构造函数遮住，导致 "URL is not a constructor"，回退链直接失效。 */
window.__MP_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
window.__MP_BASE = location.pathname.indexOf('/m1/') >= 0 ? '../mp/' : './mp/';

/* Emscripten 胶水执行时会给全局 Module 装一批「已废弃属性」的抛错 getter：
     if(!Object.getOwnPropertyDescriptor(Module,"arguments")) defineProperty(get(){ abort(...) })
   之后任何代码再读到 Module.arguments 就立刻 abort，整个 wasm 实例报废。
   这里预先把这些属性定义成普通数据属性，胶水检测到 descriptor 已存在就会跳过安装。 */
(function(){
  var M = window.Module = window.Module || {};
  ['arguments','thisProgram','preRun','postRun','print','printErr','onRuntimeInitialized']
  .forEach(function(k){
    if (!Object.getOwnPropertyDescriptor(M, k)){
      try { Object.defineProperty(M, k, { configurable:true, writable:true, value:undefined }); } catch(e){}
    }
  });
})();

(function(){
  var bases = location.pathname.indexOf('/m1/') >= 0 ? ['../mp/','./mp/'] : ['./mp/','../mp/'];
  bases.push(window.__MP_CDN);
  var i = 0;
  function tryNext(){
    if(i >= bases.length){ window.__MP_FAIL = true; return; }
    var base = bases[i++];
    var s = document.createElement('script');
    s.src = base + 'face_mesh.js';
    s.crossOrigin = 'anonymous';
    s.onload  = function(){ window.__MP_BASE = base; window.__MP_OK = true; };
    s.onerror = function(){ tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
<script>
(function(){
'use strict';

/* ============================================================
   0. 工具
   ============================================================ */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function now(){ return performance.now(); }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function median(arr){
  if(!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){ return a-b; });
  var m = Math.floor(s.length/2);
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
}
function pct(arr, p){
  if(!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){ return a-b; });
  var i = clamp((s.length-1) * p, 0, s.length-1);
  var lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? s[lo] : s[lo] + (s[hi]-s[lo]) * (i-lo);
}
function r1(v){ return Math.round(v*10)/10; }
/* NaN 不能直接当数字印出来：视线没采到帧时抖动无定义，必须显示「无数据」而不是 NaN */
function fmtPx(v, unit){ return isFinite(v) ? r1(v) + (unit||'px') : '无数据'; }
function r0(v){ return Math.round(v); }
function $(id){ return document.getElementById(id); }

/* 最小二乘：解 A x = b，A 为 n×m */
function solveLS(A, b, m){
  var n = A.length, M = [], i, j, k;
  for(i=0;i<m;i++) M.push(new Float64Array(m+1));
  for(i=0;i<m;i++){
    for(j=0;j<m;j++){
      var s=0;
      for(k=0;k<n;k++) s += A[k][i]*A[k][j];
      M[i][j]=s;
    }
    var t=0;
    for(k=0;k<n;k++) t += A[k][i]*b[k];
    M[i][m]=t;
  }
  for(i=0;i<m;i++){
    var mx=i;
    for(j=i+1;j<m;j++) if(Math.abs(M[j][i])>Math.abs(M[mx][i])) mx=j;
    if(Math.abs(M[mx][i])<1e-12) return null;
    var tmp=M[i]; M[i]=M[mx]; M[mx]=tmp;
    var pv=M[i][i];
    for(j=i;j<=m;j++) M[i][j]/=pv;
    for(j=0;j<m;j++){
      if(j===i) continue;
      var f=M[j][i];
      if(f===0) continue;
      for(k=i;k<=m;k++) M[j][k] -= f*M[i][k];
    }
  }
  var out=[];
  for(i=0;i<m;i++) out.push(M[i][m]);
  return out;
}

/* one-euro：人眼是「注视—眼跳—注视」的离散步进，原始信号直接驱动会抽搐 */
function OneEuro(mc,beta,dc){ this.mc=mc; this.beta=beta; this.dc=dc; this.xp=null; this.dxp=0; }
OneEuro.prototype.alpha=function(cut,dt){
  var tau = 1/(2*Math.PI*cut);
  return 1/(1 + tau/dt);
};
OneEuro.prototype.filter=function(x,dt){
  if(this.xp===null){ this.xp=x; this.dxp=0; return x; }
  var dx=(x-this.xp)/dt;
  var ad=this.alpha(this.dc,dt);
  this.dxp = this.dxp + ad*(dx-this.dxp);
  var cut = this.mc + this.beta*Math.abs(this.dxp);
  var a = this.alpha(cut,dt);
  this.xp = this.xp + a*(x-this.xp);
  return this.xp;
};
OneEuro.prototype.reset=function(){ this.xp=null; this.dxp=0; };

var FX = new OneEuro(1.1,0.045,1.0);
var FY = new OneEuro(1.1,0.045,1.0);

/* ============================================================
   1. 全局状态
   ============================================================ */
var S = {
  phase:'home',          // home|calib|instr|report|play|end
  camReady:false,
  mpReady:false,
  mpDead:false,
  faceOk:false,
  detectFps:0,
  totalFrames:0,
  blinkFrames:0
};

var Gaze = {
  raw:{x:0,y:0,ok:false},
  filt:{x:0,y:0,ok:false},
  jitter:0,
  lostMs:0
};

var Model = { a:null, b:null, mean:{x:0,y:0}, flipX:false };  // flipX：前摄画面左右反转，x 轴需镜像

/* 眨眼：逐用户阈值，默认沿用上一版 0.105，测量后按基线重算 */
var BLINK = {
  thr: 0.105,
  thrSource: '默认值',
  openBuf: [],           // 基线采样 {t,v}
  active: false,
  startT: 0,
  events: [],            // {s,e,d}
  naturalP90: 0
};

/* 两只眼的角点在画面里互为镜像，这是最容易写错的一处：
     画面左侧那只眼：33 在左、133 在右
     画面右侧那只眼：362 在左、263 在右
   旧版按「外眼角 → 内眼角」取轴，于是两眼的 ax 方向相反（一个指向画面右、一个指向画面左）。
   两眼一平均，水平信号刚好互相抵消 —— ax 基本恒在 0.5 附近不动，剩下全是噪声。
   校准再去拟合这份噪声，就会解出 a1=-18.5 这种又负又大的斜率。
   现在统一按「画面左 → 画面右」取轴，两眼同向，平均才有意义。 */
var LM = {
  A_L:33,  A_R:133, A_TOP:159, A_BOT:145, A_IRIS:468,   // 画面左侧那只眼
  B_L:362, B_R:263, B_TOP:386, B_BOT:374, B_IRIS:473    // 画面右侧那只眼
};

/* ============================================================
   2. 画布
   ============================================================ */
var cvs = $('game');
var ctx = cvs.getContext('2d', { alpha:false });
var W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
resize();

/* ============================================================
   3. MediaPipe 启动（幂等 + 三层防御）
   ============================================================ */
var faceMesh = null;
var mpBootPromise = null;
var detectBusy = false;
var detectCount = 0;
var fpsT0 = 0;

function waitMpScript(){
  /* 脚本是动态加载的，可能比用户点按钮慢。没等到就直接报错会误判成"引擎不可用"。 */
  return new Promise(function(resolve, reject){
    var t0 = now();
    (function chk(){
      if(typeof window.FaceMesh === 'function') return resolve();
      if(window.__MP_FAIL) return reject(new Error('MediaPipe 脚本全部加载失败（同源与 CDN 均不可达），请检查网络后刷新'));
      if(now() - t0 > 10000) return reject(new Error('MediaPipe 脚本加载超时，请检查网络后刷新'));
      setTimeout(chk, 120);
    })();
  });
}

function bootFaceMesh(){
  if(S.mpReady && faceMesh) return Promise.resolve();
  if(mpBootPromise) return mpBootPromise;
  if(S.mpDead) return Promise.reject(new Error('虹膜引擎已停止工作，刷新页面后重试'));

  mpBootPromise = waitMpScript().then(function(){
    faceMesh = new window.FaceMesh({ locateFile:function(f){ return window.__MP_BASE + f; } });
    faceMesh.setOptions({
      maxNumFaces:1, refineLandmarks:true,
      minDetectionConfidence:0.5, minTrackingConfidence:0.5
    });
    faceMesh.onResults(onFace);
    return faceMesh.initialize();
  }).then(function(){
    S.mpReady = true;
    $('stMp').textContent = '就绪';
  }).catch(function(e){
    mpBootPromise = null;
    var m = (e && e.message) ? e.message : String(e);
    if(/abort|Module\.|RuntimeError|WebAssembly/i.test(m)){
      S.mpDead = true;
      $('stMp').textContent = '初始化失败';
      throw new Error('虹膜引擎在这台手机上初始化失败（wasm 运行时中断）。刷新可重试一次；仍失败说明机型与引擎不兼容。');
    }
    throw e;
  });
  return mpBootPromise;
}

function startCamera(){
  if(S.camReady && $('cam').srcObject) return Promise.resolve();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return Promise.reject(new Error('浏览器不支持摄像头调用'));
  }
  if(!window.isSecureContext){
    return Promise.reject(new Error('当前不是 https 安全环境，浏览器禁止调用摄像头'));
  }
  return navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:30,max:30} }
  }).then(function(stream){
    var v = $('cam');
    v.srcObject = stream;
    return v.play();
  }).then(function(){
    S.camReady = true;
    $('stCam').textContent = '已启动';
  }, function(err){
    var n = (err && err.name) || '';
    if(n === 'NotAllowedError') throw new Error('摄像头权限被拒绝。请在浏览器设置里允许本站访问摄像头，然后刷新页面。');
    if(n === 'NotFoundError')   throw new Error('没有找到摄像头。');
    if(n === 'NotReadableError')throw new Error('摄像头被其他应用占用，关掉那个应用后重试。');
    throw new Error('摄像头启动失败：' + (err && err.message ? err.message : n));
  });
}

var pumpRunning = false;
function pumpDetect(){
  /* 幂等：重复调用不能起两条检测循环，否则同一帧会被 send 两次，帧率与延迟全部失真 */
  if(pumpRunning) return;
  pumpRunning = true;
  (function tick(){
    requestAnimationFrame(tick);
    if(!S.camReady || !S.mpReady || detectBusy) return;
    var v = $('cam');
    if(v.readyState < 2 || v.videoWidth === 0) return;
    detectBusy = true;
    faceMesh.send({ image:v }).then(function(){
      detectBusy = false;
      detectCount++;
      var dt = now() - fpsT0;
      if(dt > 700){
        S.detectFps = Math.round(detectCount * 1000 / dt);
        detectCount = 0; fpsT0 = now();
        $('stFps').textContent = S.detectFps + ' fps';
      }
    }).catch(function(){ detectBusy = false; });
  })();
}

/* 478 点 → 双眼虹膜归一化特征（相对量，抗头动） */
function extractFeat(lm){
  function eye(outer, inner, top, bot, iris){
    var o=lm[outer], i=lm[inner], t=lm[top], b=lm[bot], c=lm[iris];
    if(!o||!i||!t||!b||!c) return null;
    var ux=i.x-o.x, uy=i.y-o.y;
    var wx=b.x-t.x, wy=b.y-t.y;
    var du=ux*ux+uy*uy, dw=wx*wx+wy*wy;
    if(du<1e-9||dw<1e-9) return null;
    return {
      ax: ((c.x-o.x)*ux + (c.y-o.y)*uy)/du,
      ay: ((c.x-t.x)*wx + (c.y-t.y)*wy)/dw,
      open: Math.sqrt(dw)/Math.sqrt(du)
    };
  }
  var a = eye(LM.A_L,LM.A_R,LM.A_TOP,LM.A_BOT,LM.A_IRIS);
  var b = eye(LM.B_L,LM.B_R,LM.B_TOP,LM.B_BOT,LM.B_IRIS);
  if(!a||!b) return null;
  return { ax:(a.ax+b.ax)/2, ay:(a.ay+b.ay)/2, open:Math.min(a.open,b.open) };
}

function predict(fx,fy){
  if(!Model.a) return null;
  /* 前摄画面左右是反的：玩家看屏幕右侧时，虹膜在画面里往左走。
     镜像必须在**输入端**做。只把 a1 取反、让输入不动，等于把输出左右颠倒，
     会把"看左"解成"看右"——实测复测误差从 6px 恶化到 126px。 */
  var x = (Model.flipX ? -1 : 1) * (fx - Model.mean.x);
  var y = fy - Model.mean.y;
  var v = [1, x, y, x*y];
  var sx=0, sy=0;
  for(var i=0;i<4;i++){ sx += v[i]*Model.a[i]; sy += v[i]*Model.b[i]; }
  return { sx:sx, sy:sy };
}

/* ============================================================
   4. 眨眼：检测 + 事件
   ============================================================ */
var blinkHooks = null;   // {onEnd:function(dur)}

function onBlinkEnd(dur){
  if(dur < 80) return;                       // 抖动，丢弃
  BLINK.events.push({ s:BLINK.startT, e:now(), d:dur });
  if(BLINK.events.length > 400) BLINK.events.shift();
  if(blinkHooks && blinkHooks.onEnd) blinkHooks.onEnd(dur);
}

/* ============================================================
   5. 三区判定（含 60px 吸附带 / 迟滞）
   ============================================================ */
var ZONE = { active:-1, band:60 };

function classifyZone(sx){
  var zw = W/3;
  var z = sx < zw ? 0 : (sx < 2*zw ? 1 : 2);
  if(ZONE.active >= 0 && z !== ZONE.active){
    /* 迟滞：向上换区要越过边界 +60px，向下换区要越过边界 −60px。
       这 120px 的滞回带就是方案里的「软吸附带」，用于抑制边界抖动，
       且只作用于「区」这个离散量，不作用于坐标。 */
    if(z > ZONE.active){
      if(sx < (ZONE.active+1)*zw + ZONE.band) z = ZONE.active;
    } else {
      if(sx > ZONE.active*zw - ZONE.band) z = ZONE.active;
    }
  }
  ZONE.active = z;
  return z;
}

/* ============================================================
   6. 面部回调：视线管线
   ============================================================ */
var recOpen = false;      // 仪器模式采样开关
var onFaceHooks = null;   // {onSample:function(f, sx, sy)}

function onFace(res){
  S.totalFrames++;
  var lms = res.multiFaceLandmarks;

  if(!lms || !lms.length){
    S.faceOk = false;
    Gaze.lostMs += 33;
    return;
  }
  S.faceOk = true;

  var f = extractFeat(lms[0]);
  if(!f) return;

  if(recOpen) BLINK.openBuf.push({ t:now(), v:f.open });

  /* 校准采样：必须在下面两处 return 之前，否则永远采不到帧。
     （v0.1 把这一行漏了，导致 calBuf 恒为空、5 个点全废、报「0/5」——
       报错文案还去怪用户的脸和光线，实际是采样管道没接线。）
     这里刻意不用 BLINK.thr：那是游戏内眨眼判定阈值，逐人标定前默认 0.105，
     眼裂偏小或戴眼镜的人正常睁眼就贴着线，会被整段判成闭眼而采不到样本。
     校准只需要虹膜位置，用一个纯粹的「眼皮确实合上」硬下限即可。 */
  if(calActive && f.open >= 0.05) calBuf.push({ ax:f.ax, ay:f.ay });

  /* 闭眼：不更新视线（保持上次有效值，否则睁眼瞬间会弹飞） */
  if(f.open < BLINK.thr){
    if(!BLINK.active){ BLINK.active = true; BLINK.startT = now(); }
    S.blinkFrames++;
    return;
  }

  if(BLINK.active){
    BLINK.active = false;
    onBlinkEnd(now() - BLINK.startT);
  }

  if(!S.calibrated()) return;
  var p = predict(f.ax, f.ay);
  if(!p) return;

  var sx = p.sx * W, sy = p.sy * H;
  if(!isFinite(sx) || !isFinite(sy)) return;
  sx = clamp(sx, -W*0.3, W*1.3);
  sy = clamp(sy, -H*0.3, H*1.3);

  Gaze.raw.x = sx; Gaze.raw.y = sy; Gaze.raw.ok = true;

  var dt = Math.min(0.2, Math.max(0.008, (now() - (onFace._t || now()))/1000));
  onFace._t = now();

  var fx2 = FX.filter(sx, dt);
  var fy2 = FY.filter(sy, dt);

  var jx = sx-fx2, jy = sy-fy2;
  Gaze.jitter = Gaze.jitter*0.88 + Math.sqrt(jx*jx+jy*jy)*0.12;

  Gaze.filt.x = fx2; Gaze.filt.y = fy2; Gaze.filt.ok = true;
  Gaze.lostMs = 0;

  /* 三区判定：只在玩法与仪器模式下更新，避免影响校准阶段的采样。
     触摸降级时视线不再驱动选区，否则会与手指抢控制权。 */
  if((S.phase === 'play' || S.phase === 'instr') && !DEG.on) classifyZone(fx2);

  if(onFaceHooks && onFaceHooks.onSample) onFaceHooks.onSample(f, sx, sy);
}

S.calibrated = function(){ return !!Model.a; };

/* ============================================================
   7. 屏幕管理：所有遮罩一次性关闭（上一版就是卡在这里进不去游戏）
   ============================================================ */
var SCREENS = ['scrHome','scrCalib','scrInstr','scrReport','scrEnd'];

function hideAllScreens(){
  SCREENS.forEach(function(id){ $(id).classList.add('hide'); });
  $('target').classList.remove('on');
}

function showScreen(id){
  hideAllScreens();
  $(id).classList.remove('hide');
}

function toast(msg, withReload){
  $('toastMsg').textContent = msg;
  $('toastBtn').style.display = withReload === false ? 'none' : 'block';
  $('toast').classList.add('on');
}
$('toastBtn').addEventListener('click', function(){ location.reload(); });

function fail(e){
  var msg = (e && e.message) ? e.message : String(e);
  S.phase = 'home';
  showScreen('scrHome');
  $('degBtn').classList.remove('on');
  /* 连续 3 次校准失败 → 自动降级，而不是把玩家卡在"进不去" */
  if(/校准|复测|面部|增益|方程/.test(msg)){
    DEG.calFails++;
    if(DEG.calFails >= 3){
      enterDegrade('连续 ' + DEG.calFails + ' 次校准失败');
      return;
    }
  }
  toast(msg, /引擎|wasm|初始化/.test(msg));
}

/* ============================================================
   8. 校准：5 点校准 + 5 点复测（两组点错开）
   ============================================================ */
/* 校准点 */
var CAL_PTS = [
  { x:0.16, y:0.16 }, { x:0.84, y:0.16 }, { x:0.50, y:0.50 },
  { x:0.16, y:0.84 }, { x:0.84, y:0.84 }
];
/* 复测点：与校准点全部错开。重合会算出 0 误差的假精度——上一版真实犯过的错。 */
var VER_PTS = [
  { x:0.34, y:0.30 }, { x:0.66, y:0.30 }, { x:0.50, y:0.70 },
  { x:0.22, y:0.58 }, { x:0.78, y:0.58 }
];

var calBuf = [];
var calActive = false;

function showTarget(nx, ny){
  var t = $('target');
  t.style.left = Math.round(nx*W) + 'px';
  t.style.top  = Math.round(ny*H) + 'px';
  t.classList.add('on');
}
function hideTarget(){ $('target').classList.remove('on'); }

function sleepUntilFace(){
  return new Promise(function(resolve){
    var t0 = now();
    (function chk(){
      if(S.faceOk) return resolve();
      if(now()-t0 > 20000) return resolve();
      setTimeout(chk, 150);
    })();
  });
}

/* 采集某个点的虹膜特征中位数 */
function samplePoint(pt, ms){
  return wait(620).then(function(){
    showTarget(pt.x, pt.y);
    calBuf = [];
    calActive = true;
    var t0 = now();
    return new Promise(function(res){
      (function tick(){
        if(now()-t0 >= ms){ calActive = false; return res(); }
        setTimeout(tick, 50);
      })();
    });
  }).then(function(){
    calActive = false;
    if(calBuf.length < 3) return null;
    var axs = calBuf.map(function(v){ return v.ax; });
    var ays = calBuf.map(function(v){ return v.ay; });
    return { ax:median(axs), ay:median(ays), tx:pt.x, ty:pt.y, n:calBuf.length };
  });
}

function runCalibration(){
  S.phase = 'calib';
  showScreen('scrCalib');
  Model.a = null; Model.b = null; Model.flipX = false;
  FX.reset(); FY.reset();
  ZONE.active = -1;
  $('calTip').textContent = '请正对镜头，戴上眼镜也可以但要避免反光';
  $('calSub').textContent = '';

  return sleepUntilFace().then(function(){
    if(!S.faceOk){ throw new Error('没有检测到面部。请确认前置摄像头对着正脸、光线充足。'); }
    $('calTip').textContent = '校准中，眼睛跟着绿点走';

    var calFeats = [];
    var calDiag = [];      // 每个点实际采到的帧数，失败时直接报出来
    var chain = Promise.resolve();
    CAL_PTS.forEach(function(pt, i){
      chain = chain.then(function(){
        $('calSub').textContent = '校准点 ' + (i+1) + ' / ' + CAL_PTS.length + '　采样中…';
        $('calFill').style.width = ((i)/CAL_PTS.length*70) + '%';
        return samplePoint(pt, 1100).then(function(r){
          calDiag.push(r ? r.n : 0);
          if(r) calFeats.push(r);
          $('calSub').textContent = '校准点 ' + (i+1) + ' / ' + CAL_PTS.length +
            '　采到 ' + (r ? r.n : 0) + ' 帧' + (r ? '' : '（不足 3 帧，作废）');
        });
      });
    });

    return chain.then(function(){
      hideTarget();
      var good = calFeats.filter(function(v){ return v; });
      if(good.length < 4){
        /* 区分「管道断了」和「真的没看到脸」——这两种情况该给用户完全不同的指引。
           全 0 帧说明程序侧没产出样本，怪用户毫无意义。 */
        var zeroAll = calDiag.every(function(n){ return n === 0; });
        if(zeroAll){
          throw new Error('校准中断：5 个点全部采到 0 帧，采样管道没有产出数据。' +
            '这不是你的脸、光线或眼镜的问题，是程序缺陷。请把这句原话发给我。');
        }
        throw new Error('有效校准点不足（' + good.length + '/5，各点帧数 ' +
          calDiag.join(' / ') + '）。部分点没采满，通常是中途离开了画面或持续闭眼，正脸对准镜头重试即可。');
      }

      Model.mean.x = good.reduce(function(s,v){ return s+v.ax; },0) / good.length;
      Model.mean.y = good.reduce(function(s,v){ return s+v.ay; },0) / good.length;

      var A=[], bx=[], by=[];
      good.forEach(function(g){
        var x=g.ax-Model.mean.x, y=g.ay-Model.mean.y;
        A.push([1,x,y,x*y]); bx.push(g.tx); by.push(g.ty);
      });
      var sa = solveLS(A,bx,4), sb = solveLS(A,by,4);
      if(!sa || !sb){
        throw new Error('校准方程退化——眼动特征动态范围过小，可能信号没被正确捕捉。请正对镜头重试。');
      }
      /* —— 方向：前摄原始帧是未镜像的 ——
         玩家看向屏幕右侧时，虹膜在画面里其实是往左走的，所以 a1 天然为负。
         旧版把它当"异常"直接拦下，等于让所有人都不合格。
         正确做法是把 x 轴镜像回来：把 sx = a0 + a1·x + a2·y + a3·x·y 里的 x 换成 -x，
         等价于 a1、a3 取反 —— 拟合残差完全不变，只是方向摆正。 */
      var signFlip = sa[1] < 0;
      if(signFlip){ sa[1] = -sa[1]; sa[3] = -sa[3]; }
      Model.flipX = signFlip;   /* 必须在复测之前设好，predict 靠它把输入镜像回来 */

      /* —— 量级：不做硬闸门 ——
         a1 ≈ 1/(全屏所需的虹膜行程占眼宽的比例)。人眼宽约 30mm，屏幕两端对应的
         虹膜位移通常只有眼宽的 5%–12%，所以 a1 落在 8–20 才是常态。
         旧版的 a1∈[2,9] 是照合成数据反推出来的，会把大多数真人挡在门外。
         真正判得死的只有两件事：特征有没有动态范围、复测误差落不落进容差。 */
      var a1 = sa[1], b2 = sb[2];
      var axs = good.map(function(v){ return v.ax; });
      var span = Math.max.apply(null, axs) - Math.min.apply(null, axs);
      if(!isFinite(a1) || !isFinite(b2) || Math.abs(a1) < 1.5){
        throw new Error('校准失败：水平眼动信号过弱（a1=' + r1(a1) + '，跨度 ' + span.toFixed(4) +
          '）。请正对镜头、整张脸放进取景框中央，眼睛跟绿点时真的转动眼球（不要只转头）。');
      }
      if(span < 0.006){
        throw new Error('校准失败：5 个校准点上虹膜位置几乎没有变化（跨度 ' + span.toFixed(4) +
          '）。通常是摄像头没对着正脸，或眼睛被刘海、镜框反光挡住。');
      }
      Model.a = sa; Model.b = sb;
      $('calFill').style.width = '70%';
      return { a1:a1, b2:b2, span:span, signFlip:signFlip };
    }).then(function(gains){
      /* 复测：验证点与校准点错开，误差才不会算成 0 */
      var verFeats = [];
      var verDiag = [];
      var c2 = Promise.resolve();
      VER_PTS.forEach(function(pt, i){
        c2 = c2.then(function(){
          $('calSub').textContent = '复测点 ' + (i+1) + ' / ' + VER_PTS.length + '　采样中…';
          $('calFill').style.width = (70 + (i+1)/VER_PTS.length*30) + '%';
          return samplePoint(pt, 900).then(function(r){
            verDiag.push(r ? r.n : 0);
            if(r) verFeats.push(r);
          });
        });
      });
      return c2.then(function(){
        hideTarget();
        var errs = [];
        verFeats.forEach(function(v){
          var p = predict(v.ax, v.ay);
          if(!p) return;
          var ex = (p.sx - v.tx) * W;
          var ey = (p.sy - v.ty) * H;
          errs.push(Math.sqrt(ex*ex + ey*ey));
        });
        return { gains:gains, errs:errs, verDiag:verDiag };
      });
    });
  });
}

/* ============================================================
   9. 仪器模式：五项测量
   ============================================================ */
var INSTR = null;

function newInstr(){
  return {
    calGains:null,
    calErrs:[],          // 5 点复测误差 px
    jitterStd:0, jitterP2P:0, jitterMaxJump:0, jitterFrames:0,
    zoneTrials:[],       // {target, got, ms}
    blinkHist:null, blinkCount:0, blinkMed:0, blinkP90:0,
    openP50:0, openThr:0,
    startedAt:now()
  };
}

/* 第二步：静视抖动 10 秒 */
function measureJitter(){
  return new Promise(function(resolve){
    var xs=[], ys=[], jumps=[], last=null, t0=now();
    onFaceHooks = { onSample:function(f, sx, sy){
      xs.push(sx); ys.push(sy);
      if(last){ jumps.push(Math.abs(sx-last.sx)); }
      last = { sx:sx, sy:sy };
    }};
    $('insTip').textContent = '第二步：盯着屏幕正中央的十字，不要动，保持 10 秒';
    $('insFix').classList.add('on');
    (function tick(){
      var el = (now()-t0)/1000;
      $('insFill').style.width = Math.min(100, el/10*100) + '%';
      $('insLive').innerHTML = '<div class="kv"><span>已采样</span><b>' + xs.length + ' 帧</b></div>' +
        '<div class="kv"><span>剩余</span><b>' + Math.max(0, r0(10-el)) + ' 秒</b></div>';
      if(el >= 10){
        onFaceHooks = null;
        $('insFix').classList.remove('on');
        /* 一帧都没有时不能算出「抖动 0px」——那是最漂亮也最假的数字。
           视线根本没被算出来时，抖动标准差无定义，必须标成 NaN 让报告说没有数据。 */
        INSTR.jitterFrames = xs.length;
        if(xs.length < 10){
          INSTR.jitterStd = NaN; INSTR.jitterP2P = NaN; INSTR.jitterMaxJump = NaN;
          return resolve();
        }
        var mx = xs.reduce(function(s,v){ return s+v; },0)/xs.length;
        var my = ys.reduce(function(s,v){ return s+v; },0)/ys.length;
        var vx=0, vy=0;
        xs.forEach(function(v){ vx += (v-mx)*(v-mx); });
        ys.forEach(function(v){ vy += (v-my)*(v-my); });
        INSTR.jitterStd = Math.sqrt((vx+vy)/(xs.length*2));
        INSTR.jitterP2P = Math.max.apply(null, xs.concat(ys)) - Math.min.apply(null, xs.concat(ys));
        INSTR.jitterMaxJump = jumps.length ? Math.max.apply(null, jumps) : 0;
        return resolve();
      }
      setTimeout(tick, 100);
    })();
  });
}

/* 第三步：三区判定准确率，30 次 */
function measureZones(){
  return new Promise(function(resolve){
    var i = 0, target = -1, t0 = 0, latched = false, startZone = -1, stall = 0;
    var layer = $('insZones');
    $('insTip').textContent = '第三步：屏幕会亮起青色区，把视线移到那一区（共 30 次）';
    layer.classList.add('on');

    function paint(z){
      for(var k=0;k<3;k++) layer.children[k].classList.toggle('on', k === z);
    }
    function done(){
      paint(-1); layer.classList.remove('on'); onFaceHooks = null; resolve();
    }

    function next(){
      if(i >= 30) return done();
      startZone = ZONE.active;
      /* 必须等视线先被判进某一区，才知道「起点」在哪。
         目标区永远取与起点不同的区 —— 否则玩家一动不动也有 1/3 的概率命中，
         准确率会凭空高出三分之一，量出来的数是虚的，比没有更糟。 */
      if(startZone < 0){
        paint(-1);
        if(++stall > 40) return done();   // 约 1.6 秒仍无判定 → 视线没工作，别再空转
        return setTimeout(next, 40);
      }
      stall = 0;
      var pool = [0,1,2].filter(function(z){ return z !== startZone; });
      target = pool[Math.floor(Math.random()*pool.length)];
      latched = false;
      t0 = now();
      $('insFill').style.width = (i/30*100) + '%';
      paint(target);
      (function tick(){
        var el = now()-t0;
        var got = ZONE.active;
        $('insLive').innerHTML =
          '<div class="kv"><span>第几次</span><b>' + (i+1) + ' / 30</b></div>' +
          '<div class="kv"><span>起点区</span><b>' + '左中右'[startZone] + '</b></div>' +
          '<div class="kv"><span>目标区</span><b style="color:#46ecf2">' + '左中右'[target] + '</b></div>' +
          '<div class="kv"><span>当前判定</span><b>' + (got<0?'--':'左中右'[got]) + '</b></div>';
        if(!latched && got === target){
          latched = true;
          INSTR.zoneTrials.push({ target:target, got:got, ms:Math.round(el) });
          return setTimeout(function(){ paint(-1); i++; next(); }, 260);
        }
        if(el >= 1600){
          INSTR.zoneTrials.push({ target:target, got:got, ms:-1 });
          return setTimeout(function(){ paint(-1); i++; next(); }, 120);
        }
        setTimeout(tick, 40);
      })();
    }
    onFaceHooks = null;
    next();
  });
}

/* 第四步：自然眨眼基线 30 秒 */
function measureBlinkBaseline(){
  return new Promise(function(resolve){
    var t0 = now();
    BLINK.openBuf = [];
    recOpen = true;
    $('insTip').textContent = '第四步：自然地看着屏幕，正常眨眼，30 秒。不要刻意控制。';
    (function tick(){
      var el = (now()-t0)/1000;
      $('insFill').style.width = Math.min(100, el/30*100) + '%';
      $('insLive').innerHTML = '<div class="kv"><span>已采集</span><b>' + BLINK.openBuf.length + ' 帧</b></div>' +
        '<div class="kv"><span>剩余</span><b>' + Math.max(0, r0(30-el)) + ' 秒</b></div>';
      if(el >= 30){
        recOpen = false;
        var vals = BLINK.openBuf.map(function(o){ return o.v; });
        var p50 = pct(vals, 0.50);
        var p5  = pct(vals, 0.05);
        INSTR.openP50 = p50;
        /* 阈值取睁眼基线的 55%，夹在 0.05–0.16 之间。这是逐用户标定的核心。 */
        var thr = clamp(p50*0.55, 0.05, 0.16);
        INSTR.openThr = thr;
        BLINK.thr = thr;
        BLINK.thrSource = '基线标定（睁眼 P50=' + r1(p50*1000)/1000 + '）';

        /* 用新阈值重扫 open 序列，得到眨眼事件与时长分布 */
        var evs = [], inB = false, st = 0, lastT = 0;
        BLINK.openBuf.forEach(function(o){
          if(o.v < thr){
            if(!inB){ inB = true; st = o.t; }
          } else {
            if(inB){ inB = false; var d = o.t - st; if(d >= 40) evs.push(d); }
          }
          lastT = o.t;
        });
        if(inB) evs.push(lastT - st);

        var hist = { '<80':0, '80-120':0, '120-200':0, '200-400':0, '>400':0 };
        evs.forEach(function(d){
          if(d < 80) hist['<80']++;
          else if(d < 120) hist['80-120']++;
          else if(d < 200) hist['120-200']++;
          else if(d < 400) hist['200-400']++;
          else hist['>400']++;
        });
        INSTR.blinkHist = hist;
        INSTR.blinkCount = evs.length;
        INSTR.blinkMed = median(evs);
        INSTR.blinkP90 = pct(evs, 0.90);
        BLINK.naturalP90 = INSTR.blinkP90;
        BLINK.events = [];
        $('stThr').textContent = BLINK.thr.toFixed(4) + '（基线标定）';
        return resolve();
      }
      setTimeout(tick, 100);
    })();
  });
}

/* 汇总：给判断 */
function instrVerdict(){
  var e = INSTR.calErrs;
  if(!e.length) return { mean:0, med:0, p95:0, max:0, tier:'无数据', needDegrade:true };
  var mean = e.reduce(function(s,v){ return s+v; },0)/e.length;
  var med  = median(e);
  var p95  = pct(e, 0.95);
  var max  = Math.max.apply(null, e);
  var tier, need;
  if(mean <= 200){ tier = '≤200px · 可继续推进'; need = false; }
  else if(mean <= 280){ tier = '200–280px · 擦边上限，建议保留降级'; need = true; }
  else { tier = '>280px · 超出方案可行域'; need = true; }
  return { mean:mean, med:med, p95:p95, max:max, tier:tier, needDegrade:need };
}

function zoneStats(){
  var t = INSTR.zoneTrials;
  if(!t.length) return { acc:0, n:0, lat:0, cm:[[0,0,0],[0,0,0],[0,0,0]], miss:0 };
  var cm = [[0,0,0],[0,0,0],[0,0,0]];
  var hit=0, lat=[], miss=0;
  t.forEach(function(r){
    var g = r.got < 0 ? -1 : r.got;
    if(g >= 0) cm[r.target][g]++;
    if(g === r.target){ hit++; if(r.ms >= 0) lat.push(r.ms); }
    else miss++;
  });
  return { acc:hit/t.length, n:t.length, lat: lat.length? median(lat):-1, cm:cm, miss:miss };
}

  if(INSTR.calGains){

  if(!isFinite(INSTR.jitterStd)) L.push('  【注意】第二步只采到 ' + INSTR.jitterFrames + ' 帧，抖动值无法计算，不是「抖动为 0」。');

  });
  L.push('');
  L.push('【4 自然眨眼基线】30 秒，共 ' + INSTR.blinkCount + ' 次，中位 ' + r0(INSTR.blinkMed) + 'ms，P90 ' + r0(INSTR.blinkP90) + 'ms');
  if(INSTR.blinkHist){
    L.push('  时长分布 <80:' + INSTR.blinkHist['<80'] + '  80-120:' + INSTR.blinkHist['80-120'] +
      '  120-200:' + INSTR.blinkHist['120-200'] + '  200-400:' + INSTR.blinkHist['200-400'] +
      '  >400:' + INSTR.blinkHist['>400']);
  }
  L.push('  睁眼基线 P50 ' + INSTR.openP50.toFixed(4) + ' → 本机眨眼阈值 ' + INSTR.openThr.toFixed(4));

  L.push('');

/* ============================================================
   10. 玩法灰盒
   ============================================================ */
var P = {
  chargeRate: 220,      // +/s  不可调
  chargeMax: 100,
  decay: 140,           // −/s
  blindRate: 110,       // 盲者带标记时的半速
  execMs: 200,          // 处决阈值  不可调
  shieldMs: 120,        // 护盾阈值  不可调
  telegraph: 500,       // 前摇 ms（难度旋钮）
  enemySpeed: 85,       // px/s
  spawnGap: 3000,       // ms
  runMs: 75000,
  hp: 3
};

var GM = null;

/* 降级模式：眼动精度不够时的兜底。玩法逻辑完全不变，只把「视点选三区」
   换成「手指点三区」，闭眼处决与护盾照旧走眨眼。这不是失败路径，是产品形态之一。 */
var DEG = { on:false, reason:'', calFails:0, jitterT:0 };

function enterDegrade(reason){
  if(DEG.on) return;
  DEG.on = true;
  DEG.reason = reason;
  $('degBtn').textContent = '用眼动';
  $('degBtn').classList.add('on');
  /* 对局中不用 toast，它会遮住整个下半屏，改成 HUD 顶部小字提示 */
  if(S.phase !== 'play') toast('已切到触摸模式：' + reason + '。点屏幕选目标，闭眼照旧处决。');
}
function exitDegrade(){
  DEG.on = false;
  DEG.reason = '';
  $('degBtn').textContent = '切触摸';
  if(S.phase !== 'play') $('degBtn').classList.remove('on');
}
function toggleDegrade(){
  if(DEG.on) exitDegrade(); else enterDegrade('玩家手动切换');
}

function newGame(){
  return {
    on:false, t0:0, elapsed:0,
    hp:P.hp, kills:0, blocked:0, hits:0, missed:0,
    enemies:[], nextSpawn:0, spawnGap:P.spawnGap,
    blackout:0, flash:0,
    restDone:false,
    blinkLog:[], execLog:[], nonIntent:0, execTotal:0,
    lastLockBlip:0
  };
}

function playGeom(){
  var hud = 104;
  return { hud:hud, attackY:H-hud-46, spawnY:-26, zw:W/3 };
}

function spawnEnemy(){
  var g = playGeom();
  var isBlind = Math.random() < 0.3;
  var z = Math.floor(Math.random()*3);
  var gz = (GM && GM.enemies) || [];
  /* 避免同一区同时挤 3 个以上 */
  var sameZone = gz.filter(function(e){ return e.zone === z && e.state === 'walk'; }).length;
  if(sameZone >= 2){ z = (z+1)%3; }
  GM.enemies.push({
    zone:z, y:g.spawnY, cd:0, lock:false, blind:isBlind, mark:0,
    state:'walk', tel:0, telStart:0
  });
}

function zoneOfEnemy(e, g){ return e.zone; }

function startPlay(){
  GM = newGame();
  GM.on = true;
  GM.t0 = now();
  GM.nextSpawn = 1200;
  ZONE.active = -1;
  S.phase = 'play';
  hideAllScreens();
  $('degBtn').classList.add('on');
  $('degBtn').textContent = DEG.on ? '用眼动' : '切触摸';
  DEG.jitterT = 0;
  startAudio();
  blinkHooks = {
    onEnd:function(dur){
      if(!GM || !GM.on) return;
      GM.blinkLog.push({ t: now()-GM.t0, d: dur });
      if(dur >= P.execMs) doExecute(dur);
      if(dur >= P.shieldMs) GM.lastShield = { s: now()-dur, e: now() };
      /* 声标记：每次有效闭眼给盲者 0.8s 可凝视窗口 */
      if(dur >= P.execMs){
        GM.enemies.forEach(function(e){ if(e.blind && e.state === 'walk') e.mark = 800; });
        GM.blackout = 220;
      } else {
        GM.blackout = 140;
      }
      GM.flash = 60;
    }
  };
}

function doExecute(dur){
  var g = playGeom();
  var locked = GM.enemies.filter(function(e){ return e.lock && e.state === 'walk'; });
  if(!locked.length) return;
  /* 「可能非意图」：闭眼时长落在自然眨眼 P90 以内 → 与自然眨眼无法区分 */
  var suspect = BLINK.naturalP90 > 0 && dur <= BLINK.naturalP90;
  locked.forEach(function(e){
    e.state = 'dead';
    GM.kills++;
  });
  GM.execTotal += locked.length;
  if(suspect) GM.nonIntent += locked.length;
  GM.execLog.push({ t:now()-GM.t0, n:locked.length, dur:Math.round(dur), suspect:suspect });
  sfx('exec');
}

function endPlay(reason){
  if(!GM || !GM.on) return;
  GM.on = false;
  blinkHooks = null;
  stopAudio();
  S.phase = 'end';
  var secs = Math.round((now()-GM.t0)/1000);
  var nonIntentRate = GM.execTotal ? GM.nonIntent/GM.execTotal : 0;
  $('endTitle').textContent = reason === 'time' ? '时限到' : (reason === 'hp' ? '你被碰到了' : '已结束');
  $('endStats').innerHTML =
    '<div class="kv"><span>击杀</span><b>' + GM.kills + '</b></div>' +
    '<div class="kv"><span>挡下</span><b>' + GM.blocked + '</b></div>' +
    '<div class="kv"><span>受伤</span><b>' + GM.hits + '</b></div>' +
    '<div class="kv"><span>漏杀（碰到底线）</span><b>' + GM.missed + '</b></div>' +
    '<div class="kv"><span>用时</span><b>' + secs + ' 秒</b></div>' +
    '<div class="kv"><span>输入模式</span><b>' + (DEG.on ? '触摸降级' : '眼动') + '</b></div>' +
    '<div class="kv"><span>闭眼事件</span><b>' + GM.blinkLog.length + '</b></div>' +
    '<div class="kv"><span>可能非意图处决</span><b>' + Math.round(nonIntentRate*100) + '%</b></div>';
  $('endText').value = playReport(secs, nonIntentRate);
  buildFatigue();
  showScreen('scrEnd');
}

function playReport(secs, nonIntentRate){
  var L = [];
  L.push('《一个眼神杀死你》M1 玩法一局');
  L.push('时间 ' + new Date().toLocaleString('zh-CN'));
  L.push('设备 ' + navigator.userAgent);
  L.push('击杀 ' + GM.kills + '　挡下 ' + GM.blocked + '　受伤 ' + GM.hits + '　漏杀 ' + GM.missed);
  L.push('用时 ' + secs + ' 秒　闭眼事件 ' + GM.blinkLog.length + ' 次');
  L.push('处决总数 ' + GM.execTotal + '　可能非意图 ' + GM.nonIntent +
    '（' + Math.round(nonIntentRate*100) + '%）');
  L.push('本机眨眼阈值 ' + BLINK.thr.toFixed(4) + '　自然眨眼 P90 ' + r0(BLINK.naturalP90) + 'ms');
  L.push('本局输入模式 ' + (DEG.on ? '触摸降级（原因：' + DEG.reason + '）' : '眼动'));
  if(!BLINK.naturalP90){
    L.push('【注意】本局前没有跑过眨眼基线，所以「可能非意图」用的 P90=0，');
    L.push('       这一项恒为 0，不具备参考价值。要拿到这个数，先去跑一遍仪器模式。');
  }
  var ds = GM.blinkLog.map(function(b){ return b.d; });
  if(ds.length){
    L.push('闭眼时长 中位 ' + r0(median(ds)) + 'ms　P90 ' + r0(pct(ds,0.9)) + 'ms　最长 ' + r0(Math.max.apply(null,ds)) + 'ms');
  }
  L.push('');
  L.push('非意图处决占比判据：>30% 说明处决阈值需要上调');
  L.push('—— 以上数据全部在本机计算，未上传 ——');

function buildFatigue(){

/* ---- 玩法渲染 ---- */
function renderPlay(dt){
  var g = playGeom();
  ctx.fillStyle = '#070a10';
  ctx.fillRect(0,0,W,H);

  /* 三区底 */
  for(var z=0;z<3;z++){
    var x0 = z*g.zw;
    var act = (ZONE.active === z);
    ctx.fillStyle = act ? 'rgba(47,214,166,0.10)' : 'rgba(255,255,255,0.012)';
    ctx.fillRect(x0+1, 0, g.zw-2, H-g.hud);
    ctx.strokeStyle = 'rgba(120,150,180,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0,0); ctx.lineTo(x0,H-g.hud); ctx.stroke();
    /* 攻击线 */
    ctx.strokeStyle = 'rgba(232,84,79,0.22)';
    ctx.setLineDash([6,8]);
    ctx.beginPath(); ctx.moveTo(x0+6, g.attackY); ctx.lineTo(x0+g.zw-6, g.attackY); ctx.stroke();
    ctx.setLineDash([]);
  }

  /* 敌人 */
  GM.enemies.forEach(function(e){
    if(e.state === 'dead') return;
    var cx = e.zone*g.zw + g.zw/2;
    var charged = clamp(e.cd/P.chargeMax, 0, 1);

    if(e.state === 'telegraph'){
      var k = 1 - (now()-e.telStart)/P.telegraph;
      ctx.fillStyle = 'rgba(232,84,79,' + (0.10 + 0.22*Math.max(0,k)) + ')';
      ctx.fillRect(e.zone*g.zw, 0, g.zw, H-g.hud);
    }

    /* 蓄力弧 */
    if(charged > 0.02 && !e.lock){
      ctx.strokeStyle = 'rgba(47,214,166,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, e.y, 20, -Math.PI/2, -Math.PI/2 + Math.PI*2*charged);
      ctx.stroke();
    }

    /* 本体 */
    var r = 13;
    ctx.beginPath();
    ctx.arc(cx, e.y, r, 0, Math.PI*2);
    if(e.lock){
      var pulse = 0.5 + 0.5*Math.sin(now()/90);
      ctx.fillStyle = 'rgba(232,84,79,' + (0.45+0.3*pulse) + ')';
      ctx.fill();
      ctx.strokeStyle = '#ff8a85';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, e.y, r+7, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(232,84,79,' + (0.25+0.45*pulse) + ')';
      ctx.setLineDash([4,5]); ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.fillStyle = e.blind ? '#141b24' : '#1b2530';
      ctx.fill();
      ctx.strokeStyle = e.blind
        ? (e.mark>0 ? '#2fd6a6' : '#4a5766')
        : '#7d93a8';
      ctx.lineWidth = 2;
      ctx.stroke();
      if(e.blind){
        ctx.fillStyle = e.mark>0 ? 'rgba(47,214,166,0.85)' : 'rgba(90,105,122,0.7)';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(e.mark>0 ? '声' : '盲', cx, e.y+3.5);
      }
    }
  });

  /* HUD */
  var hy = H - g.hud;
  ctx.fillStyle = '#0b1119';
  ctx.fillRect(0, hy, W, g.hud);
  ctx.strokeStyle = '#182231';
  ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(W,hy); ctx.stroke();

  var labels = ['左','中','右'];
  for(var z2=0;z2<3;z2++){
    var bx = z2*g.zw + 18, bw = g.zw - 36;
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(bx, hy+34, bw, 8);
    var best = 0;
    GM.enemies.forEach(function(e){
      if(e.zone === z2 && e.state !== 'dead' && !e.lock) best = Math.max(best, e.cd/P.chargeMax);
    });
    var anyLock = GM.enemies.some(function(e){ return e.zone===z2 && e.lock && e.state!=='dead'; });
    ctx.fillStyle = anyLock ? '#e8544f' : '#2fd6a6';
    ctx.fillRect(bx, hy+34, bw*clamp(best,0,1), 8);
    ctx.fillStyle = anyLock ? '#ff8a85' : '#5d6b7d';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[z2], bx+bw/2, hy+26);
  }

  /* 生命 & 计数 */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e8eef7';
  ctx.font = '600 15px sans-serif';
  ctx.fillText('♥ ' + GM.hp, 18, hy+72);
  ctx.fillStyle = '#5d6b7d';
  ctx.font = '12px sans-serif';
  ctx.fillText('击杀 ' + GM.kills + '　挡 ' + GM.blocked, 70, hy+72);

  var left = Math.max(0, P.runMs - (now()-GM.t0));
  ctx.textAlign = 'right';
  ctx.fillStyle = left < 10000 ? '#e8544f' : '#5d6b7d';
  ctx.fillText(r0(left/1000) + 's', W-18, hy+72);

  if(DEG.on){
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb9b6';
    ctx.font = '12px sans-serif';
    ctx.fillText('触摸模式 · 点屏幕选目标', W/2, 24);
  }

  /* 闭眼黑幕 + 眼底红晕 */
  if(GM.blackout > 0 || BLINK.active){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);
    if(GM.flash > 0){
      ctx.fillStyle = 'rgba(120,10,10,' + (GM.flash/60*0.55) + ')';
      ctx.fillRect(0,0,W,H);
    }
  }

  /* 养神节拍 */
  if(GM.blackout > 600){
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(232,238,247,0.5)';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('闭眼养神', W/2, H/2);
  }

  if(!S.calibrated()){
    ctx.fillStyle = 'rgba(232,238,247,0.75)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('未校准 — 请先回首页做校准', W/2, H/2);
  }
}

function stepPlay(dt){
  var g = playGeom();
  var t = now();

  /* 养神节拍：45% 处触发一次，2 秒 */
  if(!GM.restDone && GM.elapsed > P.runMs*0.45){
    GM.restDone = true;
    GM.blackout = 2000;
    sfx('breath');
  }
  if(GM.blackout > 0) GM.blackout -= dt*1000;
  if(GM.flash > 0) GM.flash -= dt*1000;

  if(GM.blackout > 0) return;

  /* 自动降级判定：抖动持续超 280px，或面部连续丢失超 20 秒 */
  if(!DEG.on){
    if(Gaze.jitter > 280){
      DEG.jitterT += dt*1000;
      if(DEG.jitterT > 2000) enterDegrade('视线抖动 ' + r0(Gaze.jitter) + 'px，超过 280px 上限');
    } else {
      DEG.jitterT = Math.max(0, DEG.jitterT - dt*600);
    }
    if(Gaze.lostMs > 20000) enterDegrade('面部连续丢失超过 20 秒');
  }

  /* 区充电 */
  var z = ZONE.active;
  GM.enemies.forEach(function(e){
    if(e.state !== 'walk') return;
    if(e.mark > 0) e.mark -= dt*1000;
    if(e.zone === z){
      var rate = e.blind ? (e.mark > 0 ? P.blindRate : 0) : P.chargeRate;
      e.cd = Math.min(P.chargeMax, e.cd + rate*dt);
    } else {
      e.cd = Math.max(0, e.cd - P.decay*dt);
    }
    if(e.cd >= P.chargeMax && !e.lock){
      e.lock = true;
      if(t - GM.lastLockBlip > 90){ sfx('lock'); GM.lastLockBlip = t; }
    }
  });

  /* 敌人推进 */
  GM.enemies.forEach(function(e){
    if(!GM.on) return;
    if(e.state === 'dead') return;
    if(e.lock) return;                    // 锁瞳后原地不动，等被处决
    if(e.state === 'walk'){
      e.y += P.enemySpeed * dt;
      if(e.y >= g.attackY){
        e.state = 'telegraph';
        e.telStart = t;
        sfx('drum');
      }
    } else if(e.state === 'telegraph'){
      if(t - e.telStart >= P.telegraph){
        /* 前摇期间闭眼 ≥120ms 则挡下 */
        var sh = GM.lastShield;
        var shielded = sh && sh.e >= e.telStart - 40;
        if(shielded){ GM.blocked++; sfx('block'); }
        else { GM.hp--; GM.hits++; sfx('hit'); }
        e.state = 'dead';
        GM.missed++;
        if(GM.hp <= 0){ endPlay('hp'); }
      }
    }
  });

  /* 生成 */
  GM.nextSpawn -= dt*1000;
  if(GM.nextSpawn <= 0){
    spawnEnemy();
    if(Math.random() < 0.35) spawnEnemy();
    GM.spawnGap = Math.max(1400, GM.spawnGap - 40);
    GM.nextSpawn = GM.spawnGap;
  }

  GM.enemies = GM.enemies.filter(function(e){ return e.state !== 'dead'; });

  if(now() - GM.t0 >= P.runMs) endPlay('time');
}

/* ============================================================
   11. 音频（WebAudio 合成，无外部文件）
   ============================================================ */
var AC = null, master = null, hum = null, humGain = null;

function startAudio(){
  /* 第二局开始时会话已存在但被 suspend 过，必须 resume，否则这一局全程无声 */
  if(AC){
    if(AC.state === 'suspended'){ try { AC.resume(); } catch(e){} }
    return;
  }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 0.6;
    master.connect(AC.destination);
    hum = AC.createOscillator();
    hum.type = 'sawtooth';
    hum.frequency.value = 120;
    humGain = AC.createGain();
    humGain.gain.value = 0;
    hum.connect(humGain);
    humGain.connect(master);
    hum.start();
  } catch(e){ AC = null; }
}

function stopAudio(){
  try {
    if(humGain) humGain.gain.value = 0;
    if(AC && AC.state === 'running') AC.suspend();
  } catch(e){}
}

function sfx(kind){
  if(!AC || AC.state !== 'running') return;
  var t = AC.currentTime, o, g2;
  function tone(f, dur, type, vol){
    o = AC.createOscillator(); g2 = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g2); g2.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  if(kind === 'lock')  { tone(1180, 0.10, 'square', 0.12); }
  if(kind === 'exec')  { tone(180, 0.26, 'sawtooth', 0.22); tone(90, 0.34, 'sine', 0.20); }
  if(kind === 'drum')  { tone(70, 0.16, 'sine', 0.28); }
  if(kind === 'block') { tone(520, 0.09, 'triangle', 0.16); }
  if(kind === 'hit')   { tone(120, 0.22, 'square', 0.24); }
  if(kind === 'breath'){ tone(200, 1.6, 'sine', 0.10); }
}

/* 蓄力嗡鸣跟随 */
function updateHum(){
  if(!humGain || !GM || !GM.on){ if(humGain) humGain.gain.value = 0; return; }
  var best = 0;
  GM.enemies.forEach(function(e){ if(e.state === 'walk') best = Math.max(best, e.cd/P.chargeMax); });
  var open = (BLINK.active || GM.blackout > 0) ? 0 : 1;
  humGain.gain.value = 0.035 * best * open;
  hum.frequency.value = 110 + 260*best;
}

/* ============================================================
   12. 主循环
   ============================================================ */
var lastT = now();
var acc = 0;
var STEP = 1/120;

function loop(){
  requestAnimationFrame(loop);
  var t = now();
  var dt = Math.min(0.1, (t - lastT)/1000);
  lastT = t;

  if(S.phase === 'play' && GM && GM.on){
    acc += dt;
    var guard = 0;
    while(acc >= STEP && guard < 8){ stepPlay(STEP); acc -= STEP; guard++; }
    GM.elapsed = t - GM.t0;
    updateHum();
    renderPlay(dt);
  } else {
    /* 仪器模式的十字与三区都已改由 DOM 层绘制（canvas 会被 .scr 遮罩完全盖住），
       这里只负责铺底色。 */
    ctx.fillStyle = '#070a10';
    ctx.fillRect(0,0,W,H);
  }
}
requestAnimationFrame(loop);

/* ============================================================
   13. 仪器模式主流程
   ============================================================ */
function runInstrument(){
  S.phase = 'instr';
  INSTR = newInstr();
  showScreen('scrInstr');
  $('insTitle').textContent = '仪器模式';
  $('insLive').innerHTML = '';

  $('insTip').textContent = '第一步：校准（5 点校准 + 5 点错开复测）';
  $('insFill').style.width = '0%';

  runCalibration().then(function(r){
    /* 校准内部把 S.phase 置成了 'calib' 且不会自己改回来。
       不在这里设回 'instr'，onFace 里的三区判定就永远不执行（它只在 play/instr 下跑），
       ZONE.active 恒为 -1 —— 第三步"当前判定"永远是 --，一个都命中不了。 */
    S.phase = 'instr';
    INSTR.calGains = r.gains;
    INSTR.calErrs = r.errs;
    if(!r.errs.length) throw new Error('复测没有采到有效点，请重新校准。');
    showScreen('scrInstr');
    $('insTip').textContent = '第一步完成：复测 ' + r.errs.length + ' 点，误差均值 ' + r0(instrVerdict().mean) + 'px';
    $('insFill').style.width = '10%';
    return wait(700);
  }).then(function(){
    return measureJitter();
  }).then(function(){
    return measureZones();
  }).then(function(){
    return measureBlinkBaseline();
  }).then(function(){
    showReport();
  }).catch(function(e){
    if(S.phase === 'instr' || S.phase === 'calib'){ fail(e); }
  });
}

/* ============================================================
   14. 事件绑定
   ============================================================ */
function ensureReady(){
  return startCamera()
    .then(function(){ return bootFaceMesh(); })
    .then(function(){ pumpDetect(); });
}

$('btnInstr').addEventListener('click', function(){
  var b = this; b.disabled = true; b.textContent = '启动摄像头…';
  ensureReady().then(function(){
    /* 进入仪器模式后所有遮罩都要关掉，只留仪器面板 */
    hideAllScreens();
    b.disabled = false; b.textContent = '仪器模式 · 先测数据';
    runInstrument();
  }).catch(function(e){
    b.disabled = false; b.textContent = '仪器模式 · 先测数据';
    fail(e);
  });
});

$('btnPlay').addEventListener('click', function(){
  var b = this; b.disabled = true; b.textContent = '启动摄像头…';
  ensureReady().then(function(){
    b.disabled = false; b.textContent = '玩法灰盒 · 直接试玩';
    if(!S.calibrated()){
      /* 没校准就先校准，校准完直接进游戏 */
      return runCalibration().then(function(r){
        hideAllScreens();
        var mm = (r.errs && r.errs.length) ? median(r.errs) : 9999;
        startPlay();
        /* 校准误差中位已经越过玩法可行域时，硬让玩家用眼动，只会被当成"游戏坏了"。
           直接给触摸模式，比让他自己去找右上角那个小按钮诚实。 */
        if(mm > 280) enterDegrade('校准误差中位 ' + r0(mm) + 'px，超出玩法容差');
      });
    }
    hideAllScreens();
    startPlay();
  }).catch(function(e){
    b.disabled = false; b.textContent = '玩法灰盒 · 直接试玩';
    fail(e);
  });
});

$('btnCalCancel').addEventListener('click', function(){
  S.phase = 'home'; showScreen('scrHome');
});
$('btnInsCancel').addEventListener('click', function(){
  recOpen = false; onFaceHooks = null;
  S.phase = 'home'; showScreen('scrHome');
});
$('btnRepHome').addEventListener('click', function(){
  S.phase = 'home'; showScreen('scrHome');
});
$('btnEndHome').addEventListener('click', function(){
  S.phase = 'home'; showScreen('scrHome');
  $('degBtn').classList.remove('on');
});

$('degBtn').addEventListener('click', function(ev){
  ev.stopPropagation();
  toggleDegrade();
});

/* 触摸降级：点屏幕三块纵向区域选目标，闭眼处决仍走眨眼 */
cvs.addEventListener('pointerdown', function(ev){
  if(S.phase !== 'play' || !DEG.on || !GM || !GM.on) return;
  var x = ev.clientX;
  ZONE.active = x < W/3 ? 0 : (x < 2*W/3 ? 1 : 2);
});

$('btnCopy').addEventListener('click', function(){
  var ta = $('repText');
  ta.focus(); ta.select();
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ $('btnCopy').textContent = '已复制'; }, function(){ $('btnCopy').textContent = '已全选，长按复制'; });
    } else { $('btnCopy').textContent = '已全选，长按复制'; }
  } catch(e){ $('btnCopy').textContent = '已全选，长按复制'; }
});
$('btnCopyEnd').addEventListener('click', function(){
  var ta = $('endText');
  ta.focus(); ta.select();
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){}, function(){});
    }
  } catch(e){}
  $('btnCopyEnd').textContent = '已全选，长按复制';
});

/* 首次进入：先只启动摄像头，让用户看到设备状态，不自动跑任何测量 */
$('stThr').textContent = BLINK.thr.toFixed(3) + '（默认）';

})();
